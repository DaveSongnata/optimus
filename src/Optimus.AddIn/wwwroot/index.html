  // Honest reading of what dominates this document (Fase 1: inventário; Fase 2 mede os bytes).
  // Cada fato é um emblema, construído a partir do OBJETO — nunca fazendo parse da frase que nós
  // mesmos montamos linhas acima. Um parser da própria saída quebra no dia em que alguém traduz o
  // texto, e quebra em silêncio.
  var notes = [];
  if (d.inPowerClip > 0) notes.push(['', T('opt.note.powerclip', d.inPowerClip)]);
  if (d.raster > 0)      notes.push(['', T('opt.note.raster', d.raster)]);
  if (d.effects > 0)     notes.push(['', T('opt.note.effects', d.effects)]);
  if (d.nodesCounted === false) notes.push(['warn', T('opt.note.nonodes')]);
  else if (d.nodes > 50000)     notes.push(['warn', T('opt.note.manynodes', fmt(d.nodes))]);
  if (!notes.length)     notes.push(['ok', T('opt.note.simple')]);

  document.getElementById('inv-note').innerHTML =
    '<div class="badges">' + notes.map(function(n){
      return '<span class="badge-i' + (n[0] ? ' ' + n[0] : '') + '">' + esc(n[1]) + '</span>';
    }).join('') + '</div>';

  renderSize(d.size);
  renderFluidity(d.fluidity, d);
  document.getElementById('inv').classList.add('show');
}

// ── objetivo TAMANHO: composição exata + teto honesto ──────
function renderSize(s){
  var box = document.getElementById('obj-size');
  if (!s || s.available === false){
    document.getElementById('sz-total').textContent = '—';
    document.getElementById('sz-bars').innerHTML = '';
    document.getElementById('sz-note').textContent =
      (s && s.note) ? s.note : T('opt.size.savefirst');
    return;
  }

  document.getElementById('sz-total').textContent = mb(s.totalBytes);

  var rows = [
    ['opt.bar.icc',       s.icc],
    ['opt.bar.embfonts',  s.embFonts],
    ['opt.bar.raster',    s.raster],
    ['opt.bar.vector',    s.vector],
    ['opt.bar.preview',   s.preview],
    ['opt.bar.embedded',  s.embedded],
    ['opt.bar.fonttable', s.fonts],
    ['opt.bar.metadata',  s.metadata]
  ].filter(function(r){ return r[1] > 0.05; });

  document.getElementById('sz-bars').innerHTML = rows.map(function(r){
    return '<div class="bar"><span class="bk">' + esc(T(r[0])) + '</span>'
         + '<span class="bt"><span class="bf" style="width:' + Math.min(100, r[1]) + '%"></span></span>'
         + '<span class="bv">' + fmtPct(r[1]) + '%</span></div>';
  }).join('');

  // The honest ceiling, and the ONE lever that dominates this particular file.
  var n = [];

  if (s.dominantLever === 'icc'){
    // Measured at 97% of a real client file. Huge — but the profile is normally referenced by the
    // artwork, so this is a colour-management decision, never a free cleanup.
    n.push(T('opt.size.icc', fmtPct(s.icc), kb(s.iccBytes)));
    n.push(s.iccUsed ? T('opt.size.icc.used') : T('opt.size.icc.unused'));
  } else if (s.dominantLever === 'fonts'){
    n.push(T('opt.size.fonts', fmtPct(s.embFonts)));
  } else if (s.needsResampleFor50){
    n.push(T('opt.size.needresample', fmtPct(s.raster), fmtPct(s.ceilingResample)));
  } else if (s.rasterDominated){
    n.push(T('opt.size.rasterdom', fmtPct(s.raster)));
  }

  n.push(T('opt.size.ceiling', fmtPct(s.losslessCeiling), fmtPct(s.ceilingNoRaster)));

  // Repeated art (O15). Stated LAST and separately because on a step-and-repeat drawing it dwarfs
  // every other lever — and unlike them it costs nothing: the coordinates are byte-identical.
  if (s.distinctShapes > 0) {
    n.push(s.repetitionSaving >= 5
      ? T('opt.size.repeat', fmt(s.objects), fmt(s.distinctShapes),
          fmtPct(s.repeatedPct), fmtPct(s.repetitionSaving))
      : T('opt.size.norepeat'));
  }

  document.getElementById('sz-note').innerHTML = whyBlock(n);
}

// ── objetivo FLUIDEZ: modelo classificado, nunca em ms ─────
var FACTOR_KEY = {
  Nodes: 'opt.flu.factor.nodes', Objects: 'opt.flu.factor.objects',
  LiveEffects: 'opt.flu.factor.effects', Nesting: 'opt.flu.factor.nesting',
  Transparencies: 'opt.flu.factor.transparencies', None: 'opt.none'
};
var ADVICE_KEY = {
  Nodes: 'opt.flu.advice.nodes',
  Objects: 'opt.flu.advice.objects',
  LiveEffects: 'opt.flu.advice.effects',
  Nesting: 'opt.flu.advice.nesting',
  Transparencies: 'opt.flu.advice.transparencies'
};
var BAND_KEY = { Light:'opt.flu.band.light', Moderate:'opt.flu.band.moderate', Heavy:'opt.flu.band.heavy' };

function renderFluidity(f, d){
  if (!f) return;
  var badge = document.getElementById('fl-band');
  badge.textContent = BAND_KEY[f.band] ? T(BAND_KEY[f.band]) : f.band;
  badge.className = 'obj-badge ' + (f.band === 'Light' ? 'light' : f.band === 'Heavy' ? 'heavy' : '');

  var factor = FACTOR_KEY[f.dominant] ? T(FACTOR_KEY[f.dominant]) : f.dominant;
  var n = [T('opt.flu.cause', factor)];
  if (ADVICE_KEY[f.dominant]) n.push(T(ADVICE_KEY[f.dominant]));
  if (d && d.nodesCounted === false) n.push(T('opt.flu.partial'));
  n.push(T('opt.flu.estimate'));
  document.getElementById('fl-note').innerHTML = whyBlock(n);
}

// ── run ────────────────────────────────────────────────────
function otimizar(){
  if (busy) return;

  // A colour-space conversion really changes the colours, so it never happens without a yes.
  if (lastEstimate && lastEstimate.requiresConfirmation){
    if (!window.confirm(T('opt.confirm.space'))) return;
  }

  document.getElementById('result').classList.remove('show');
  var p = settingsPayload();
  p.cmd = 'aplicar';
  send(p);
}

// `label` names the operation actually running. Analysing is read-only, so it must NOT say
// "Otimizando…" — that would tell the operator the file is being changed when it is not.
function setBusy(on, label){
  busy = on;
  var btn = document.getElementById('run');
  btn.disabled = on;
  var scan = document.getElementById('scan');
  if (scan) scan.disabled = on;
  // Every button that starts work is disabled while work runs — including the ones in the
  // preflight tab, which the old code did not know existed.
  var pfButtons = document.querySelectorAll('#pane-pf .pf-go, #pane-pf .scan, #pane-pf .mini-btn');
  for (var i = 0; i < pfButtons.length; i++) pfButtons[i].disabled = on;
  document.getElementById('run-ic').innerHTML = on
    ? '<span class="spinner"></span>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 12.5a1 1 0 0 0 .8 1.6H11l-1 7.9 8.5-10.5a1 1 0 0 0-.8-1.6H12l1-7.9z"/></svg>';
  document.getElementById('run-tx').textContent =
    on ? (label || T('opt.busy.default')) : T('opt.btn.run');

  // Unmissable regardless of where on screen the operator is looking — a voice-triggered command
  // used to give feedback only on this small run-button, easy to miss with eyes on the voice panel.
  var banner = document.getElementById('working-banner');
  if (banner){
    banner.classList.toggle('show', !!on);
    if (on) document.getElementById('working-text').textContent = label || T('opt.busy.default');
  }
}

// ── result render ──────────────────────────────────────────
var lastRun = null;

function showResult(d){
  lastRun = d;
  setTimeout(renderOptState, 0);
  var pct = (d.sizePct != null && d.sizePct > 0) ? d.sizePct : 0;
  document.getElementById('res-big').innerHTML = fmtPct(pct) + '<span>%</span>';
  document.getElementById('c-size').innerHTML  = kb(d.sizeBefore) + ' <small>→</small> ' + kb(d.sizeAfter);
  document.getElementById('c-nodes').innerHTML = fmt(d.nodesRemoved) + ' <small>(' + fmtPct(d.nodePct) + '%)</small>';
  document.getElementById('c-curves').textContent = fmt(d.curves) + ' / ' + fmt(d.shapes);
  var clean = [];
  if (d.emptyLayers) clean.push(T('opt.unit.layers', d.emptyLayers));
  if (d.offPage)     clean.push(T('opt.unit.offpage', d.offPage));
  document.getElementById('c-clean').textContent = clean.length ? clean.join(', ') : '—';
  var note = document.getElementById('res-note');
  note.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.75l6 6 9-13.5"/></svg>'
    + '<span>' + esc(d.reopened ? T('opt.res.reserialized') : T('opt.res.saved')) + '</span>';
  document.getElementById('result').classList.add('show');
}

// ── C# → JS ────────────────────────────────────────────────
window.optimusReceive = function(d){
  if (!d || !d.type) return;
  if (d.type === 'status'){
    // A versao saiu da tela (revisao, ponto 13): e informacao de suporte, importa uma vez por
    // instalacao. Continua alcancavel pela dica do seletor de idioma, para quem precisar reportar.
    var lang = document.getElementById('lang');
    if (lang) lang.title = T('opt.lang') + '  ·  v' + (d.build || '—');
    document.getElementById('st-doc').textContent = d.doc || '—';
    docSaved = !!d.saved;
    // Guardado, não só desenhado: a confirmação de "trocar a cor de N objetos" precisa do número,
    // e lê-lo de volta do texto da tela seria ler a própria saída como se fosse dado.
    selCount = d.sel || 0;
    document.getElementById('st-meta').textContent =
      d.sel > 0 ? T('opt.status.selected', d.sel) : T('opt.status.nosel');
    var badge = document.getElementById('st-badge');
    if (d.doc && d.doc !== T('opt.status.nodoc')){
      badge.textContent = docSaved ? T('opt.status.saved') : T('opt.status.unsaved');
      badge.className = 'badge ' + (docSaved ? 'ok' : 'no');
    } else { badge.textContent = '—'; badge.className = 'badge no'; }
  } else if (d.type === 'busy'){
    setBusy(!!d.on, d.label);
  } else if (d.type === 'log'){
    addLog(d.text, d.level);
  } else if (d.type === 'inventory'){
    // Result lands in the OTHER tab — take the operator there, or the answer to
    // what they just asked for is invisible behind a tab they are not looking at.
    if (d.ok) { showTab('opt'); showInventory(d); markInapplicableSliders(d); }
    else showAuditFailed();
  } else if (d.type === 'auditProgress'){
    showAuditProgress(d);
  } else if (d.type === 'audit'){
    if (d.ok) showAudit(d); else showAuditFailed();
  } else if (d.type === 'colorPartial'){
    showColorPartial(d);
  } else if (d.type === 'palettes'){
    showPalettes(d);
  } else if (d.type === 'paletteError'){
    showPaletteError(d);
  } else if (d.type === 'svgColors'){
    showSvgColors(d);
  } else if (d.type === 'svgImported'){
    showSvgImported(d);
  } else if (d.type === 'colorTable'){
    if (d.ok) showColorTable(d);
  } else if (d.type === 'colorsConverted'){
    showConverted(d);
  } else if (d.type === 'fontPreview'){
    showFontPreview(d);
  } else if (d.type === 'colorReplaced'){
    showColorReplaced(d);
  } else if (d.type === 'fontFolder'){
    showFontFolder(d);
  } else if (d.type === 'fontManager'){
    if (d.ok) showFontManager(d);
  } else if (d.type === 'voiceStatus'){
    voiceAnswered = true;
    voiceModelAvailable = !!d.modelAvailable;
  } else if (d.type === 'voiceRecording'){
    if (d.ok) onVoiceRecordingStarted();
  } else if (d.type === 'voiceResult'){
    handleVoiceResult(d);
  } else if (d.type === 'estimate'){
    showEstimate(d);
  } else if (d.type === 'applied'){
    if (d.ok) showApplied(d);
  } else if (d.type === 'result'){
    if (d.ok) showResult(d);
  }
};

// A lever the file does not have must be DISABLED with the reason — never promising a saving
// that cannot happen. kaneki.cdr has no embedded profile, so its colour slider says so.
function markInapplicableSliders(inv){
  var s = inv.size || {};
  SLIDERS.forEach(function(sl){
    sl.notApplicable = null;
    if (sl.key === 'color' && s.available && !(s.icc > 0)) sl.notApplicable = sl.naKey;
    if (sl.key === 'image' && s.available && !(s.raster > 0)) sl.notApplicable = sl.naKey;
  });
  renderSliders();
  scheduleEstimate();
}

// Fluidity is reported ONLY when a clock measured it, and a WORSE result is shown as worse.
// Without this rule the product would be selling the same thing as a "RAM cleaner".
function renderFluidityResult(d){
  var box = document.getElementById('res-flu');
  if (!box) return;

  if (!d.redrawMeasured){
    box.innerHTML = '<div class="flu-d">' + esc(T('opt.flu.notmeasured')) + '</div>';
    return;
  }

  var faster = d.redrawImprovedPct > 0;
  var pct = Math.abs(d.redrawImprovedPct);
  box.innerHTML =
      '<div class="flu-h"><span class="flu-k">' + esc(T('opt.flu.measured.title')) + '</span>'
    + '<span class="flu-v' + (faster ? '' : ' worse') + '">'
    + (faster ? '−' : '+') + fmtPct(pct) + '%</span></div>'
    + '<div class="flu-d">' + esc(T('opt.flu.redraw', fmtPct(d.redrawBeforeMs), fmtPct(d.redrawAfterMs)))
    + (d.effectsFlattened > 0 ? '  ·  ' + esc(T('opt.flu.flattened', fmt(d.effectsFlattened))) : '')
    + (!faster ? '  ·  ' + esc(T('opt.flu.notfaster')) : '')
    + '</div>';
}

// ── real result, measured on disk ──────────────────────────
function showApplied(d){
  var pct = d.grew ? 0 : d.savedPercent;
  document.getElementById('res-big').innerHTML = fmtPct(pct) + '<span>%</span>';
  document.getElementById('c-size').innerHTML  = mb(d.beforeBytes) + ' <small>→</small> ' + mb(d.afterBytes);
  document.getElementById('c-nodes').innerHTML = fmt(d.nodesBefore - d.nodesAfter) + ' <small>(' + fmtPct(d.nodePercent) + '%)</small>';
  document.getElementById('c-curves').textContent = T('opt.unit.remainingnodes', fmt(d.nodesAfter));
  var clean = [];
  if (d.emptyLayers)      clean.push(T('opt.unit.layers', d.emptyLayers));
  if (d.offPage)          clean.push(T('opt.unit.offpage', d.offPage));
  if (d.bitmapsResampled) clean.push(T('opt.unit.images', d.bitmapsResampled));
  if (d.effectsFlattened) clean.push(T('opt.unit.effects', d.effectsFlattened));
  document.getElementById('c-clean').textContent = clean.length ? clean.join(', ') : '—';

  renderFluidityResult(d);

  var note = document.getElementById('res-note');
  if (d.grew){
    note.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>'
      + '<span>' + esc(T('opt.res.grew', d.backup || '—')) + '</span>';
  } else {
    note.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.75l6 6 9-13.5"/></svg>'
      + '<span>' + esc(T('opt.res.predictedreal', fmtPct(d.estimatedPercent), fmtPct(d.savedPercent)))
      + (d.backup ? ' ' + esc(T('opt.res.backup', d.backup)) : '') + '</span>';
  }
  document.getElementById('result').classList.add('show');
}

// Plain-text copy of the report, so the operator can paste it into a message instead of
// digging the numbers out of the page by hand.
function copiarInventario(){
  if (!lastInv) return;
  var d = lastInv;
  var txt = [
    T('opt.copy.title'),
    T('opt.copy.doc', d.doc || '—'),
    (d.path ? T('opt.copy.path', d.path) : ''),
    T('opt.copy.time', fmt(d.ms)),
    '',
    T('opt.copy.shapes', fmt(d.shapes)),
    T('opt.copy.nodes', d.nodesCounted === false ? T('opt.notmeasured') : fmt(d.nodes)),
    T('opt.copy.nested', fmt(d.nested)),
    T('opt.copy.raster', fmt(d.raster)),
    T('opt.copy.reducible', fmt(d.reducible)),
    T('opt.copy.effects', fmt(d.effects)),
    '',
    (d.size && d.size.available)
      ? (T('opt.copy.size', mb(d.size.totalBytes), fmtPct(d.size.raster),
                            fmtPct(d.size.vector), fmtPct(d.size.preview))
         + '\n' + T('opt.copy.ceilings', fmtPct(d.size.ceilingNoRaster), fmtPct(d.size.ceilingResample)))
      : T('opt.copy.size.na'),
    (d.fluidity
      ? T('opt.copy.fluidity',
          BAND_KEY[d.fluidity.band] ? T(BAND_KEY[d.fluidity.band]) : d.fluidity.band,
          FACTOR_KEY[d.fluidity.dominant] ? T(FACTOR_KEY[d.fluidity.dominant]) : d.fluidity.dominant)
      : '')
  ].filter(function(l){ return l !== ''; }).join('\n');

  var done = function(){
    var b = document.getElementById('inv-copy'), t = document.getElementById('inv-copy-tx');
    if (!b) return;
    b.classList.add('done'); t.textContent = T('opt.btn.copied');
    setTimeout(function(){ b.classList.remove('done'); t.textContent = T('opt.btn.copy'); }, 1800);
  };

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
}

function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);
}

// ── log ────────────────────────────────────────────────────
// Console only. This used to paint an execution trace into the panel — lines written for whoever is
// debugging the product, not for whoever is closing a file. In a 340px column it took the space of
// the information the operator opened the panel to read.
//
// Nothing is lost: the host already writes every one of these lines to %TEMP%\Optimus\docker.log,
// which is where all of this week's diagnosis came from.
// Monta o disclosure de um bloco explicativo. Devolve string vazia quando não há o que explicar —
// um "Por quê?" que abre para o nada é pior que nenhum.
function whyBlock(frases){
  var txt = (frases || []).filter(Boolean).join(' ');
  if (!txt) return '';
  return '<details class="disclose"><summary>' + esc(T('opt.why')) + '</summary>'
       + '<div>' + esc(txt) + '</div></details>';
}

function addLog(text, level){
  try {
    var fn = (level === 'err') ? 'error' : (level === 'warn') ? 'warn' : 'log';
    if (window.console && console[fn]) console[fn]('[Optimus] ' + text);
  } catch (e) { /* a missing console must never break a render path */ }
}

// ── helpers ────────────────────────────────────────────────
function send(o){ try{ window.chrome.webview.postMessage(o); }catch(e){} }
// Numbers follow the chosen language: "14.342" in pt-BR is "14,342" in English, and showing the wrong
// separator to an English operator makes a node count look like a decimal.
function locale(){ return window.OPTIMUS_LANG || 'pt-BR'; }
function fmt(n){ n = Number(n)||0; return n.toLocaleString(locale()); }
function fmtPct(n){ n = Number(n)||0; return (Math.round(n*10)/10).toLocaleString(locale()); }
function kb(b){
  b = Number(b)||0;
  if (b <= 0) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(0) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}
function mb(b){ b = Number(b)||0; return b <= 0 ? '—' : (b/1024/1024).toFixed(2) + ' MB'; }

// ── language ───────────────────────────────────────────────
(function(){
  var sel = document.getElementById('lang');
  if (!sel) return;
  sel.value = window.OPTIMUS_LANG_KEY || 'pt';
  sel.addEventListener('change', function(){
    if (busy) { sel.value = window.OPTIMUS_LANG_KEY || 'pt'; return; }
    send({cmd:'idioma', tag: sel.value});
  });
})();

// ── F11: comando de voz ──────────────────────────────────────
// 100% offline: the microphone is captured and transcribed IN THE C# HOST (NAudio + a local
// whisper.cpp model, no cloud, no API key — see VoiceRecorder.cs / LocalVoiceTranscriber.cs). This
// page never touches getUserMedia; it only sends two tiny messages (start/stop) and shows whatever
// the host reports. The transcript is matched to a command with the SAME logic tested in
// VoiceCommandMatcherTests.
var voiceModelAvailable = false;
var voiceRecording = false;

function voiceFab(){ return document.getElementById('voice-fab'); }
function voiceDot(){ return document.getElementById('voice-dot'); }
function openVoicePanel(){ document.getElementById('voice-panel').classList.add('show'); }
function closeVoicePanel(){ document.getElementById('voice-panel').classList.remove('show'); }

// The FAB and the panel's header dot always agree — one state, shown twice, so the operator
// reads it the same way whether their eyes are on the button or on the panel that just opened.
function voiceSetState(state){
  voiceFab().classList.remove('rec', 'busy', 'ok', 'err');
  voiceDot().classList.remove('rec', 'ok');
  if (state){
    voiceFab().classList.add(state);
    if (state === 'rec') voiceDot().classList.add('rec');
    if (state === 'ok') voiceDot().classList.add('ok');
  }
}

function voiceFabClick(){
  if (!voiceModelAvailable){
    openVoicePanel();
    setVoiceStatus(T('opt.voice.nomodel'));
    return;
  }
  if (voiceRecording) stopVoiceRecording(); else startVoiceRecording();
}

function setVoiceStatus(text){
  document.getElementById('voice-status-text').textContent = text;
}

function startVoiceRecording(){
  // Optimistic UI, corrected by the 'voiceRecording'/'voiceResult' reply below if the host
  // couldn't actually open the microphone (no device, device busy, driver error).
  voiceSetState('busy');
  openVoicePanel();
  setVoiceStatus(T('opt.voice.starting'));
  document.getElementById('voice-transcript').textContent = '';
  document.getElementById('voice-action').textContent = '';
  send({ cmd:'voiceStart' });
}

function onVoiceRecordingStarted(){
  voiceRecording = true;
  voiceSetState('rec');
  setVoiceStatus(T('opt.voice.listening'));
}

function stopVoiceRecording(){
  if (!voiceRecording) return;
  voiceRecording = false;
  voiceSetState('busy');
  setVoiceStatus(T('opt.voice.transcribing'));
  send({ cmd:'voiceStop' });
}

// Confirmation audio is no longer spoken from here. window.speechSynthesis used whatever TTS voice
// happened to be installed on the operator's Windows — quality varied wildly machine to machine, and
// Davi rejected that inconsistency outright (2026-08-15): "já deixar embutido... não depender de
// coisas externas". The C# host now plays a fixed, pre-rendered WAV per command directly
// (VoicePlayer.cs) the instant it matches the intent — same file, same voice, every machine, every
// time. This page only shows the transcript/action text; it no longer produces any sound itself.

var VOICE_ACTION_LABEL = {
  Analyze: function(){ return T('opt.btn.analyze'); },
  Audit: function(){ return T('opt.btn.audit'); },
  Optimize: function(){ return T('opt.btn.run'); },
  SetLanguagePt: function(){ return T('opt.voice.lang.pt'); },
  SetLanguageEs: function(){ return T('opt.voice.lang.es'); },
  SetLanguageEn: function(){ return T('opt.voice.lang.en'); },
};

function handleVoiceResult(d){
  if (d.stage === 'transcribing'){ setVoiceStatus(T('opt.voice.transcribing')); return; }

  voiceRecording = false;

  if (!d.ok){
    voiceSetState('err');
    setTimeout(function(){ voiceSetState(null); }, 1600);
    setVoiceStatus(T('opt.voice.error', d.error || '?'));
    return;
  }

  var known = d.intent && d.intent !== 'Unknown' && VOICE_ACTION_LABEL[d.intent];
  var label = known ? VOICE_ACTION_LABEL[d.intent]() : '';
  var checkIcon = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.75l6 6 9-13.5"/></svg>';

  document.getElementById('voice-transcript').textContent = '“' + (d.transcript || '') + '”';
  document.getElementById('voice-action').innerHTML = known ? checkIcon + ' ' + esc(label) : '';
  setVoiceStatus(known ? T('opt.voice.executing', label) : T('opt.voice.unknown'));
  voiceSetState(known ? 'ok' : 'err');
  setTimeout(function(){ voiceSetState(null); }, 2000);
  // The spoken confirmation already played from the host (VoicePlayer) the instant the intent was
  // matched — this page only needed to update its own visuals.
}

// ── boot ───────────────────────────────────────────────────
// Each step is wrapped and independent: an exception thrown by any ONE of these (a bad selector, a
// null element) used to silently abort every top-level statement AFTER it in this script — that is
// almost certainly why voiceStatus's request never reached the host on at least one real machine
// (2026-08-14): it sat last in this exact list. A boot step failing must never take the others with
// it, and especially never take down the ONE round trip the voice button's entire "is a model
// available" state depends on.
function bootStep(label, fn){
  try { fn(); }
  catch (e) { try { send({ cmd:'status' }); } catch (e2) {} /* best-effort: at least try to recover comms */ }
}

bootStep('sliders', renderSliders);
bootStep('status', function(){ send({cmd:'status'}); });
bootStep('statusPoll', function(){ setInterval(function(){ if(!busy) send({cmd:'status'}); }, 2500); });
// The font catalog is shop-wide, not per-document — load it independently of any audit run.
bootStep('fontManager', function(){ send({cmd:'fontManager'}); });
// The state machine has to run BEFORE any data arrives, or the page opens showing every block the
// machine exists to hide — which is exactly the screen this refactor removed. The markup ships in
// the "has data" shape because that is the shape that is easiest to read in source; the first thing
// the page does is collapse it to the truth.
renderOptState();

bootStep('voiceStatus', function(){ send({cmd:'voiceStatus'}); });
bootStep('fontFolder', function(){ send({cmd:'fontFolderScan'}); });
// Perguntado de novo SO ATE responder. A versao anterior perguntava a cada 2,5 s para sempre,
// inclusive depois de ja ter a resposta: em vinte minutos de uso normal isso encheu o docker.log
// com centenas de linhas identicas e enterrou a unica linha de diagnostico que interessava.
// O objetivo era cobrir uma primeira resposta perdida, e isso e coberto por algumas tentativas —
// se em 20 s o host nao respondeu, insistir nao vai mudar nada.
var voiceTries = 0;
var voicePoll = setInterval(function(){
  if (voiceAnswered || voiceTries >= 8){ clearInterval(voicePoll); return; }
  if (busy) return;
  voiceTries++;
  send({ cmd:'voiceStatus' });
}, 2500);
</script>
