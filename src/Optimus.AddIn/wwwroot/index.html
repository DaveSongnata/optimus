<!-- F11 - comando de voz: botao flutuante, sempre visivel, qualquer aba. Em repouso e so um contorno; vira preenchido e ganha as "ondas" no instante em que passa a ouvir. -->
<!-- ══ MODAL DE PALETAS ═════════════════════════════════════════════════════
     Fica fora dos paineis de proposito: paletas nao pertencem ao arquivo aberto,
     pertencem a grafica. Abrir daqui e a mesma coisa vindo de qualquer aba. -->
<div class="modal" id="pal-modal" hidden role="dialog" aria-modal="true" aria-labelledby="pal-modal-t">
  <div class="modal-bg" onclick="palClose()"></div>
  <div class="modal-box">
    <div class="modal-h">
      <span class="modal-t" id="pal-modal-t" data-i18n="opt.pal.modal.title"></span>
      <button class="modal-x" onclick="palClose()" data-i18n-title="opt.pal.modal.close"
              aria-label="Fechar">&#10005;</button>
    </div>


    <div class="modal-b">
      <div class="pal-new">
        <input type="text" id="pal-new-name" data-i18n-placeholder="opt.pal.modal.newname"
               onkeydown="if(event.key==='Enter')palCreate()">
        <button class="mini-btn" onclick="palCreate()" data-i18n="opt.pal.modal.create"></button>
      </div>

      <!-- The other way a palette comes into being: the client already sent their logo as an SVG,
           and that file IS the colour list. Typing six hex codes off a screenshot is the chore this
           removes. -->
      <div class="pal-acts mb-3">
        <button class="pal-act" onclick="svgPick()" data-i18n="opt.pal.svg.btn"></button>
      </div>

      <!-- A refused change has to SAY so. Re-posting the unchanged list would leave the screen
           looking exactly as before, which reads as a broken button. -->
      <div class="pf-conv-r warn" id="pal-err" style="display:none"></div>

      <!-- Name the imported palette. The colours are already read at this point; the name is what
           is missing, and it is not optional (§11.2). -->
      <div class="pal-pane" id="pal-svg" style="display:none">
        <div class="pal-pane-h">
          <span class="pal-pane-t" id="pal-svg-t"></span>
          <button class="modal-x" onclick="svgCancel()" aria-label="Fechar">&#10005;</button>
        </div>
        <div class="sw-grid pal-grid" id="pal-svg-grid"></div>
        <div class="pf-note border-0" id="pal-svg-note"></div>
        <div class="pal-pane-f">
          <input type="text" id="pal-svg-name" data-i18n-placeholder="opt.pal.svg.name"
                 onkeydown="if(event.key==='Enter')svgImport()">
          <button class="mini-btn" onclick="svgImport()" data-i18n="opt.pal.svg.go"></button>
        </div>
      </div>

      <div id="pal-list"></div>



      <!-- Seletor visual. Fica embutido no painel, não flutuando: o docker tem 340px e um popup
           ancorado sairia da tela pela direita. -->
      <div class="pal-pane" id="pal-picker" style="display:none">
        <div class="pal-pane-h">
          <span class="pal-pane-t" id="pal-picker-t"></span>
          <button class="modal-x" onclick="palPickerClose()" aria-label="Fechar">&#10005;</button>
        </div>
        <div id="pal-picker-host"></div>
        <div class="pal-pane-f">
          <span class="pal-prev" id="pal-picker-prev"></span>
          <input type="text" id="pal-picker-name" data-i18n-placeholder="opt.pal.modal.addname">
          <button class="mini-btn" onclick="palPickerConfirm()" data-i18n="opt.pal.modal.add"></button>
        </div>
      </div>

      <!-- Pick from the drawing, with checkboxes. Pulling in ALL colours of a file that has 91 of
           them is not what anyone wants in a client's palette. -->
      <div class="pal-pane" id="pal-doc" style="display:none">
        <div class="pal-pane-h">
          <span class="pal-pane-t" id="pal-doc-t"></span>
          <button class="modal-x" onclick="palDocClose()" aria-label="Fechar">&#10005;</button>
        </div>
        <div class="pal-doc-grid" id="pal-doc-grid"></div>
        <div class="pal-pane-f">
          <button class="pf-go" id="pal-doc-go" onclick="palDocConfirm()" disabled></button>
        </div>
      </div>

      <!-- Last in the modal, behind a disclosure. Pushed to the middle it became a wall between
           the palette card and the picker, breaking the flow of the controls it sat among. -->
      <!-- Applying a colour rewrites the client's file, so it asks first — and the operator who is
           doing twenty of them in a row can turn that off. The preference is remembered with the
           palettes, not for this session only. -->
      <div class="pf-scope">
        <label><input type="checkbox" id="pal-confirm" checked onchange="palConfirmToggle(this.checked)">
          <span data-i18n="opt.pal.apply.confirm"></span></label>
      </div>

      <details class="disclose">
        <summary data-i18n="opt.pal.modal.how"></summary>
        <div data-i18n="opt.pal.modal.intro"></div>
      </details>
    </div>
  </div>
</div>


<div class="voice-panel" id="voice-panel">
  <div class="voice-panel-h">
    <span class="voice-dot" id="voice-dot"></span>
    <span class="voice-title" data-i18n="opt.voice.title"></span>
    <span class="voice-close" onclick="closeVoicePanel()">×</span>
  </div>

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// And the systemic fix, so a silent death can never happen again: any uncaught
// error is reported to the host log AND shown to the operator, instead of leaving
// a panel that simply does nothing with no trace anywhere.
window.onerror = function(msg, src, line, col){
  try {
    send({ cmd:'jsError', message: String(msg), line: line || 0, col: col || 0 });
    addLog('✘ ' + msg + ' (linha ' + line + ')', 'err');
  } catch(e){}
  return false;
};

// ── state ──────────────────────────────────────────────────
var busy = false, docSaved = false, selCount = 0;
var voiceAnswered = false;

// The catalog and T() are injected by the host BEFORE this script runs. The guard only exists so a
// failed injection degrades to visible key names instead of a blank docker inside CorelDRAW.
if (typeof window.T !== 'function') {
  window.T = function(k){ return k; };
  window.applyI18n = function(){};
}
var T = window.T;

// The four trade-offs, described the way a print-shop operator thinks about them. No "ICC",
// no "DPI": each end of each slider states its CONSEQUENCE. Labels are KEYS — resolved at render
// time so switching language re-renders them without touching this table.
var SLIDERS = [
  { key:'color', title:'opt.sl.color.title', field:'Color',
    left:'opt.sl.color.left', right:'opt.sl.color.right',
    options:[
      {v:'NoProfile',   l:'opt.sl.color.noprofile',  hint:'opt.sl.color.noprofile.hint'},

      {v:'High',        l:'opt.sl.color.high',       hint:'opt.sl.color.high.hint'},
      {v:'Maximum',     l:'opt.sl.color.maximum',    hint:'opt.sl.color.maximum.hint'}
    ], value:'High', naKey:'opt.sl.color.na' },

  { key:'image', title:'opt.sl.image.title', field:'Image',
    left:'opt.sl.image.left', right:'opt.sl.image.right',
    options:[
      {v:'Screen',      l:'opt.sl.image.screen',    hint:'opt.sl.image.screen.hint'},
      {v:'LargeFormat', l:'opt.sl.image.large',     hint:'opt.sl.image.large.hint'},
      {v:'FinePrint',   l:'opt.sl.image.fine',      hint:'opt.sl.image.fine.hint'},
      {v:'Untouched',   l:'opt.sl.image.untouched', hint:'opt.sl.image.untouched.hint'}
    ], value:'Untouched', naKey:'opt.sl.image.na' },

  { key:'weight', title:'opt.sl.weight.title', field:'Weight',

    ], value:'Balanced' },

var lastEstimate = null;
var estimateTimer = null;

function settingsPayload(){
  var p = {};
  SLIDERS.forEach(function(s){ p[s.key] = s.value; });
  p.removePreview = true; p.removeEmptyLayers = true;
  p.removeCompat = true;  p.reserialize = true;
  p.removeOffPage = document.getElementById('op-offpage') ? document.getElementById('op-offpage').checked : false;
  p.flattenEffects = document.getElementById('op-flatten') ? document.getElementById('op-flatten').checked : false;
  p.instanceRepeated = document.getElementById('op-instance') ? document.getElementById('op-instance').checked : false;
  p.measureRedraw = true;
  return p;
}

function renderSliders(){
  var host = document.getElementById('sliders');
  host.innerHTML = SLIDERS.map(function(s, si){
    var current = s.options.filter(function(o){ return o.v === s.value; })[0] || s.options[0];
    var na = s.notApplicable ? T(s.notApplicable) : null;
    return '<div class="sl">'
      + '<div class="sl-h"><span class="sl-t">' + esc(T(s.title)) + '</span>'
      + '<span class="sl-v">' + esc(T(current.l)) + '</span></div>'
      + '<div class="sl-track">' + s.options.map(function(o, oi){
          return '<button ' + (na ? 'disabled ' : '') + 'data-s="' + si + '" data-o="' + oi + '"'
               + (o.v === s.value ? ' class="on"' : '') + ' title="' + esc(T(o.hint)) + '">'
               + esc(T(o.l)) + '</button>';
        }).join('') + '</div>'
      + '<div class="sl-ends"><span>' + esc(T(s.left)) + '</span><span>' + esc(T(s.right)) + '</span></div>'
      // A CONSEQUENCIA da posicao escolhida, visivel. Ela estava so num title=, que nao
      // aparece com caneta nem no toque - entradas que um operador de CorelDRAW usa - e
      // nunca aparece para quem navega por teclado. A regra do produto e explicita: a
      // perda mora no ROTULO, nao em nota de rodape.
      + '<div class="sl-c">' + esc(T(current.hint)) + '</div>'
      + (na ? '<div class="sl-off">' + esc(na) + '</div>' : '')
      + '</div>';
  }).join('');

  host.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      if (busy) return;
      var s = SLIDERS[parseInt(b.getAttribute('data-s'), 10)];
      s.value = s.options[parseInt(b.getAttribute('data-o'), 10)].v;
      markCustom();
      renderSliders();
      scheduleEstimate();
    });
  });
}

// As caixas fazem parte do preset. Antes NAO faziam: "Maxima economia" deixava
// "Aproveitar arte repetida" desmarcada - e por O15 essa e A maior alavanca do
// produto (58,2% de um arquivo real de cliente, sem perder um pixel). O operador
// escolhia o preset mais agressivo e nao levava a maior economia junto.
var PRESET_BOXES = {
  Safe:       { 'op-instance':false, 'op-flatten':false },
  Balanced:   { 'op-instance':true,  'op-flatten':false },
  MaxSavings: { 'op-instance':true,  'op-flatten':true  }
};
// 'op-offpage' NAO entra em preset nenhum, de proposito: ele APAGA arte, inclusive
// anotacoes que o operador deixou de lado fora da pagina. Perda irreversivel nunca
// pode ser ligada por um clique que a pessoa deu pensando em outra coisa.

var presetIsCustom = false;

function applyPreset(name){
  var P = {
    Safe:       { color:'Maximum', image:'Untouched', weight:'Untouched',   space:'Keep' },
    Balanced:   { color:'High',    image:'Untouched', weight:'Balanced',    space:'Keep' },
    MaxSavings: { color:'NoProfile', image:'FinePrint', weight:'MaxFluidity', space:'Keep' }
  }[name];
  if (!P) return;
  SLIDERS.forEach(function(s){ if (P[s.key]) s.value = P[s.key]; });

  // O preset precisa ser VISIVEL. As caixas mudam na tela e a linha alterada
  // pisca - senao o operador nao tem como saber o que acabou de ser decidido
  // por ele, e um preset que muda coisas invisiveis e pior que nenhum preset.
  var boxes = PRESET_BOXES[name] || {};
  Object.keys(boxes).forEach(function(id){
    var el = document.getElementById(id);
    if (!el || el.checked === boxes[id]) return;
    el.checked = boxes[id];
    var row = el.parentNode;
    if (row && row.classList){
      row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
    }
  });

  presetIsCustom = false;
  paintPresetRow();
  accSummary();
  renderSliders();
  scheduleEstimate();
}

// Mexeu numa caixa ou num controle a mao? Entao o que esta na tela ja nao e o
// preset. Continuar destacando "Equilibrado" seria mentir sobre o estado atual.
function markCustom(){ presetIsCustom = true; paintPresetRow(); accSummary(); }

// ── acordeao dos ajustes finos ──────────────────────────────────────────────
function toggleAdvanced(){
  var h = document.getElementById('acc-h');
  var b = document.getElementById('acc-body');
  if (!h || !b) return;
  var open = h.getAttribute('aria-expanded') === 'true';
  h.setAttribute('aria-expanded', open ? 'false' : 'true');
  b.hidden = open;
  accSummary();
}

// Fechado, o cabecalho diz o que esta valendo la dentro. Um painel recolhido que
// nao resume vira um painel escondido, e ai o operador precisa abrir so para
// conferir - que e o custo que o acordeao existia para evitar.
function accSummary(){
  var el = document.getElementById('acc-sum');
  if (!el) return;
  var n = 0;
  ['op-instance','op-flatten','op-offpage'].forEach(function(id){
    var c = document.getElementById(id);
    if (c && c.checked) n++;
  });
  el.textContent = n === 0 ? T('opt.adv.none') : T('opt.adv.count', n);
}

function paintPresetRow(){
  var seg = document.getElementById('presets');
  if (!seg) return;
  if (presetIsCustom) seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
  var tag = document.getElementById('preset-custom');
  if (tag) tag.style.display = presetIsCustom ? '' : 'none';
}

(function(){
  var seg = document.getElementById('presets');
  seg.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      if (busy) return;
      seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      applyPreset(b.getAttribute('data-preset'));
    });
  });
})();

// Debounced so dragging across positions does not fire a file read per click.
function scheduleEstimate(){
  if (estimateTimer) clearTimeout(estimateTimer);
  estimateTimer = setTimeout(function(){
    estimateTimer = null;
    var p = settingsPayload(); p.cmd = 'estimar';
    send(p);
  }, 250);
}

// ── live estimate ──────────────────────────────────────────
function showEstimate(d){
  lastEstimate = d;
  setTimeout(renderOptState, 0);
  // Um dos dois estados existe por vez. Mostrar o card cheio com traços dentro seria oferecer a
  // forma de uma resposta sem a resposta.
  var cheio = !!(d && d.ok);
  var vazio = document.getElementById('est-empty');
  if (vazio) vazio.style.display = cheio ? 'none' : '';
  var card = document.getElementById('est');
  if (card) card.style.display = cheio ? '' : 'none';

  var v = document.getElementById('est-v');
  var fill = document.getElementById('est-fill');
  var rows = document.getElementById('est-rows');
  var warn = document.getElementById('est-warn');

  if (!d.ok){
    v.textContent = '—';
    fill.style.width = '0%';
    rows.innerHTML = '';
    warn.textContent = d.reason || '';
    return;
  }

  v.textContent = mb(d.totalBytes) + ' → ' + mb(d.projectedBytes) + '  (−' + fmtPct(d.savedPercent) + '%)';
  fill.style.width = Math.min(100, d.savedPercent) + '%';

  rows.innerHTML = (d.items || []).map(function(i){
    // Uma alavanca que o arquivo não tem continua aparecendo, com o motivo — mas o motivo é uma
    // frase inteira e ela não precisa estar aberta em todas as linhas ao mesmo tempo.
    if (!i.applicable)
      return '<div class="est-row na"><span class="rk">' + esc(i.label) + '</span>'
           + '<details class="disclose inline"><summary>' + esc(T('opt.why')) + '</summary>'
             + '<div class="d">' + esc(i.reason) + '</div>'
           + '</details></div>';
    if (i.bytes <= 0) return '';
    return '<div class="est-row"><span class="rk">' + esc(i.label) + '</span>'
         + (i.lossy ? '<span class="rl">' + esc(T('opt.est.lossy')) + '</span>' : '')
         + '<span class="rv">' + kb(i.bytes) + '</span></div>';
  }).join('');

  // Consequences belong here, in plain language, not in a footnote. C# sends KEYS so the warnings
  // read in the operator's language — the decision of WHICH warnings apply stays in C#.
  warn.textContent = (d.warnings || []).map(function(w){ return T(w); }).join('  ');
}

// ══ CONFERENCIA DE PRE-IMPRESSAO (cores + fontes) ══════════════════════════
// Ordem deliberada: VEREDITO -> achados -> dados. A versao anterior despejava a
// tabela de dados primeiro e o operador tinha de garimpar o problema nela.
var lastAudit = null, lastColorTable = null, lastFontMgr = null;
var pfFilter = 'all', pfSelKey = null, pfMode = 'Rgb', pfPickKey = null;

var pfStarted = 0;

function auditar(){
  if (busy) return;
  showTab('cores');
  pfStarted = Date.now();
  document.getElementById('pf-empty').style.display = 'none';
  document.getElementById('pf-result').style.display = 'none';
  var p = document.getElementById('pf-prog');
  p.classList.add('show');
  document.getElementById('pf-fill').style.width = '0%';
  document.getElementById('pf-pct').textContent = '0%';
  document.getElementById('pf-lab').textContent = T('opt.aud.stage.colors');
  document.getElementById('pf-step').textContent = T('opt.pf.stage', 1, 3);
  send({ cmd:'auditar' });
}

// Barra DETERMINADA, movida pela contagem real de formas do C#. Um giro
// indeterminado por 90 s e indistinguivel de travamento.
function showAuditProgress(d){
  var p = document.getElementById('pf-prog');
  if (!p.classList.contains('show')) p.classList.add('show');
  var pct = Math.max(0, Math.min(100, d.percent || 0));
  document.getElementById('pf-fill').style.width = pct + '%';
  if (d.label) document.getElementById('pf-lab').textContent = d.label;
  document.getElementById('pf-step').textContent = T('opt.pf.stage', d.step || 1, d.steps || 3);

  // Contagem dos objetos DO OPERADOR + tempo ja decorrido, em vez de so um
  // percentual seco. Medido (N=425): contagem regressiva aumenta a tensao; tempo
  // decorrido e mais tranquilo, e contar o que e dele torna a espera "trabalho
  // acontecendo" em vez de "travou".
  var parts = [pct + '%'];
  if (d.total > 1) parts.push(fmt(d.done) + ' / ' + fmt(d.total));
  if (pfStarted) parts.push(Math.round((Date.now() - pfStarted) / 1000) + ' s');
  document.getElementById('pf-pct').textContent = parts.join('  ·  ');
}

// ── veredito + achados ─────────────────────────────────────
// Cada achado carrega a CONSEQUENCIA na impressao, nao o fato tecnico.
function buildFindings(d){
  var c = d.colors || {}, fonts = d.fonts || [], out = [];

  var failed = fonts.filter(function(f){ return f.verdict === 'Failed'; });
  var missing = fonts.filter(function(f){ return f.verdict === 'NotInstalled'; });
  var names = function(list){ return list.map(function(f){ return '"' + f.name + '"'; }).join(', '); };

  if (missing.length) out.push({ tema:'fontes', sev:'err', t:T('opt.pf.f.fontmissing.t'), d:T('opt.pf.f.fontmissing.d', names(missing)) });
  if (failed.length)  out.push({ tema:'fontes', sev:'err', t:T('opt.pf.f.fontfail.t'),    d:T('opt.pf.f.fontfail.d', names(failed)) });

  if (c.mixed){
    // O caminho rapido conta pela PALETA DO DOCUMENTO, e ela super-reporta: uma cor
    // continua na paleta depois que o ultimo objeto que a usava foi apagado (O19).
    // Entao este aviso pode acusar mistura num arquivo que na pratica esta inteiro
    // num modo so - foi o que aconteceu num arquivo real, com a conversao voltando
    // "nada a fazer" logo depois. Enquanto o uso nao foi medido, o numero vem com a
    // ressalva junto, em vez de ser afirmado como fato.
    var mixedD = T('opt.pf.f.mixed.d', fmt(c.rgb), fmt(c.cmyk));
    if (lastColorTable && lastColorTable.usageMeasured === false)
      mixedD += ' ' + T('opt.pf.f.mixed.palettenote');
    out.push({ sev:'warn', t:T('opt.pf.f.mixed.t'), d: mixedD,
               go:T('opt.pf.show'), goFilter:'rgb' });
  }

  if (c.spot > 0) out.push({ sev:'warn', t:T('opt.pf.f.spot.t'), d:T('opt.pf.f.spot.d', fmt(c.spot)),
                             go:T('opt.pf.show'), goFilter:'spot' });

  var off = (lastColorTable && lastColorTable.alerts) ? lastColorTable.alerts.length : 0;
  var hasPalettes = lastColorTable && lastColorTable.palettes && lastColorTable.palettes.length > 0;
  if (hasPalettes && off > 0)
    out.push({ sev:'warn', t:T('opt.pf.f.offpalette.t'), d:T('opt.pf.f.offpalette.d', fmt(off)),
               go:T('opt.pf.show'), goFilter:'off' });

  if (c.notInspectable > 0)
    out.push({ sev:'info', t:T('opt.pf.f.notinspectable.t'), d:T('opt.pf.f.notinspectable.d', fmt(c.notInspectable)) });

  // O que esta CERTO tambem e dito: silencio nao e prova de aprovacao.
  if (!c.mixed) out.push({ sev:'ok', t:T('opt.pf.f.ok.colors.t'), d:T('opt.pf.f.ok.colors.d') });
  if (fonts.length === 0)
    out.push({ sev:'info', t:T('opt.pf.f.notext.t'), d:T('opt.pf.f.notext.d') });
  else if (!failed.length && !missing.length)
    out.push({ sev:'ok', t:T('opt.pf.f.ok.fonts.t'), d:T('opt.pf.f.ok.fonts.d', fmt(fonts.length)) });

  return out;
}

// Simbolo por severidade. Unicode basico de proposito: a pagina roda sem
// internet e sem webfont (regra do produto), entao icon-font esta fora.
var SEV_GLYPH = { err:'✕', warn:'!', ok:'✓', info:'i', sym:'Α' };

function showAudit(d){
  lastAudit = d;
  showTab('cores');
  document.getElementById('pf-prog').classList.remove('show');
  document.getElementById('pf-empty').style.display = 'none';
  document.getElementById('pf-result').style.display = 'block';

  var finds = buildFindings(d);
  var problems = finds.filter(function(f){ return f.sev === 'err' || f.sev === 'warn'; });
  var c = d.colors || {};

  // O veredito em cartão foi removido: ele repetia, num bloco inteiro, a mesma contagem que a
  // lista abaixo já dá item a item — e cada achado carrega a própria forma e severidade. O ponto
  // na aba continua avisando que há algo a ver sem ocupar altura nenhuma.
  renderFindings(finds);

  // A aba fica marcada quando ha problema, mesmo que o operador esteja na outra.
  document.getElementById('tab-pf-dot').classList.toggle('show', problems.length > 0);
  renderFonts();
  scrollToTop();
}

// Uma falha (documento nao aberto, por exemplo) devolvia ok:false e a UI nao
// fazia NADA - o operador ficava olhando uma barra parada para sempre. Agora ela
// se recolhe e o estado vazio volta, com o motivo ja no log.
function showAuditFailed(){
  document.getElementById('pf-prog').classList.remove('show');
  if (!lastAudit) document.getElementById('pf-empty').style.display = 'block';
}

// Clicar num achado leva a evidencia dele, ja filtrada. Um achado sem caminho
// para o objeto e so uma reclamacao.
function pfJump(filter){
  pfFilter = filter;
  renderColorGrid();
  var el = document.getElementById('pf-colors');
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'start' });
}

function scrollToTop(){
  try { window.scrollTo({ top:0, behavior:'smooth' }); } catch(e){ window.scrollTo(0,0); }
}

// ── grade de cores ─────────────────────────────────────────
function renderFindings(finds){
  paintFinds('pf-finds', finds.filter(function(f){ return f.tema !== 'fontes'; }));
  paintFinds('fo-finds', finds.filter(function(f){ return f.tema === 'fontes'; }));
}

function paintFinds(id, finds){
  var host = document.getElementById(id);
  if (!host) return;
  host.style.display = finds.length ? '' : 'none';
  host.innerHTML = finds.map(function(f, i){
    return '<div class="pf-find ' + f.sev + '"><span class="f-ic" aria-hidden="true">' + (SEV_GLYPH[f.sev] || '') + '</span><span class="f-b">'
         + '<div class="f-t">' + esc(f.t) + '</div>'
         // O título classifica e fica à vista; a explicação fica atrás do disclosure.
         + '<details class="disclose"><summary>' + esc(T('opt.details')) + '</summary>'
           + '<div class="f-d">' + esc(f.d) + '</div>'
         + '</details>'
         + (f.goFilter ? '<button class="f-go" onclick="pfJump(\'' + f.goFilter + '\')">'
             + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l6 7-6 7"/></svg>'
             + esc(f.go) + '</button>' : '')
         + '</span></div>';
  }).join('');
}

function showColorTable(d){
  lastColorTable = d;
  // A tabela ainda traz as paletas quando ha documento analisado; aproveitamos, mas ela deixou de
  // ser a unica fonte - o evento 'palettes' e quem manda.
  if (d.palettes){ palState.palettes = d.palettes; palState.active = d.activePalette || ''; }
  document.getElementById('pf-partial').style.display = 'none';
  // A tabela completa chegou: a medicao acabou, tenha ela rodado agora ou nao.
  if (d.usageMeasured) pfMeasuring = false;
  renderPalettes();
  // A medicao e decidida ANTES de desenhar: pintar primeiro mostrava "Medicao
  // interrompida" no instante em que ela ia comecar.
  pfAutoMeasure(!!d.usageMeasured);
  renderColorGrid();
  // Os achados dependem da paleta cadastrada, entao sao refeitos quando ela chega.
  if (lastAudit) {
    var finds = buildFindings(lastAudit);
    // Refeitos, nao so recontados: a medicao de uso chegando muda o TEXTO do aviso
    // de mistura, e recontar sem redesenhar deixava a ressalva antiga na tela.
    renderFindings(finds);
    var problems = finds.filter(function(f){ return f.sev === 'err' || f.sev === 'warn'; });
    document.getElementById('tab-pf-dot').classList.toggle('show', problems.length > 0);
  }
}

function pfMatchesFilter(r){
  if (pfFilter === 'all') return true;
  if (pfFilter === 'rgb') return r.model === 'Rgb';
  if (pfFilter === 'cmyk') return r.model === 'Cmyk';
  if (pfFilter === 'spot') return !!r.spotName || r.model === 'Spot' || r.model === 'Pantone';
  if (pfFilter === 'off') return !r.inPalette;
  return true;
}

// A cor da amostra vem dos componentes NUMERICOS lidos no C#, nunca de Color.HexValue:
// o formato daquela string nao e documentado e pintou as 128 amostras de branco num
// arquivo real (2026-08-15). Sem leitura confiavel, xadrez neutro - nunca um preto
// inventado, que mentiria justamente na peca que existe para mostrar a cor.

// Color.HexValue ja vem com '#' embutido (e formato nao documentado), entao
// concatenar outro '#' gerava '##1C1917' na tela. O rotulo passa a ser derivado
// dos componentes NUMERICOS, que sao a unica leitura confiavel que temos.
function hex2(n){ n = Math.max(0, Math.min(255, n|0)); return (n < 16 ? '0' : '') + n.toString(16).toUpperCase(); }
function hexOf(r){
  if (r && r.rgbKnown && r.rgb && r.rgb.length === 3)
    return '#' + hex2(r.rgb[0]) + hex2(r.rgb[1]) + hex2(r.rgb[2]);
  return '';
}
// Normaliza um hex vindo de paleta salva (pode ou nao ter '#').
function hexClean(v){
  var h = String(v == null ? '' : v).replace(/[^0-9a-fA-F]/g, '');
  // 8 digitos e RRGGBBAA: o seletor devolve a cor com canal alfa no fim. Cortar pelo FIM, que era
  // o que esta funcao fazia, transformava #123456ff em "3456ff" - uma cor diferente, e plausivel o
  // bastante para passar despercebida. O alfa vai fora; tinta nao tem transparencia.
  if (h.length === 8) h = h.slice(0, 6);
  else if (h.length > 6) h = h.slice(-6);
  return h.length === 6 ? h : '';
}
function swatchCss(r){
  if (r && r.rgbKnown && r.rgb && r.rgb.length === 3)
    return 'background:rgb(' + (r.rgb[0]|0) + ',' + (r.rgb[1]|0) + ',' + (r.rgb[2]|0) + ')';
  return 'background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0/10px 10px';
}

// Cores abaixo deste uso sao ruido visual: 128 amostras onde 110 marcam 0,1% escondem
// exatamente as que decidem a impressao (Davi, 2026-08-15: "um monte de coisas
// irrelevantes tipo 0,1%"). Ficam recolhidas atras de um botao, nunca descartadas.
var PF_MINOR = 1.0;
// Teto quando nao ha uso medido para ranquear: 24 amostras cabem em 6 linhas.
var PF_CAP = 24;
var pfShowMinor = false;

function renderColorGrid(){
  var d = lastColorTable;
  if (!d) return;
  var measured = d.usageMeasured !== false;
  var all = (d.rows || []).filter(pfMatchesFilter);

  var major = all, minor = [];
  // No caminho rapido nao ha % de uso, entao o corte por "abaixo de 1%" era pulado
  // e as 128 amostras iam TODAS para a tela: 1.913px de rolagem, cinco vezes o pior
  // caso do caminho medido. Sem uso para ranquear, o corte passa a ser por quantidade.
  if (!pfShowMinor){
    if (measured){
      major = all.filter(function(r){ return (r.usage || 0) >= PF_MINOR; });
      minor = all.filter(function(r){ return (r.usage || 0) < PF_MINOR; });
      // Se TUDO for miudo (arte com centenas de tons), esconder tudo nao ajudaria ninguem.
      if (major.length === 0) { major = all; minor = []; }
    } else if (all.length > PF_CAP){
      major = all.slice(0, PF_CAP);
      minor = all.slice(PF_CAP);
    }
  }

  var FILTERS = [['all','opt.pf.filter.all'],['rgb','opt.pf.filter.rgb'],
                 ['cmyk','opt.pf.filter.cmyk'],['spot','opt.pf.filter.spot'],
                 ['off','opt.pf.filter.off']];
  document.getElementById('pf-filters').innerHTML = FILTERS.map(function(f){
    return '<button class="pf-chip' + (pfFilter === f[0] ? ' on' : '') + '" onclick="pfSetFilter(\'' + f[0] + '\')">'
         + esc(T(f[1])) + '</button>';
  }).join('');

  document.getElementById('pf-colors-n').textContent = fmt(all.length);
  document.getElementById('pf-grid-empty').style.display = all.length ? 'none' : 'block';

  // CARTAO DE TINTA. Faixa larga com o valor em mono embaixo, como a ficha de tinta da bancada.
  // A grade que estava aqui dava ~40px de cor numa coluna de 340px - area insuficiente para julgar
  // cor de impressao - e escondia o valor numa dica, que ninguem le em varredura.
  // Grade compacta: a amostra é o objeto, e só ela. O valor de cada cor não vive mais na lista —
  // ninguém lê 128 valores em varredura, lê a COR e depois procura o número da que interessa.
  // O contorno de #767676 continua em cada amostra: uma cor branca do documento dá 1,04:1 contra o
  // papel e sem contorno simplesmente não existe na tela.
  var grid = document.getElementById('pf-grid');
  grid.className = 'sw-grid';
  grid.innerHTML = major.map(function(r){
    return '<button class="sw' + (r.inPalette ? '' : ' off') + (pfSelKey === r.key ? ' on' : '') + '"'
         + ' style="' + swatchCss(r) + '"'
         + ' title="' + esc(colorValue(r)) + '"'
         + ' onclick="pfSelect(\'' + esc(r.key).replace(/'/g, "\\'") + '\')"></button>';
  }).join('');

  var tail = document.getElementById('pf-minor');
  if (minor.length){
    tail.style.display = 'block';
    tail.textContent = measured
      ? T('opt.pf.colors.minor', fmt(minor.length), fmtPct(PF_MINOR))
      : T('opt.pf.colors.rest', fmt(minor.length));
  } else if (pfShowMinor && measured){
    tail.style.display = 'block';
    tail.textContent = T('opt.pf.colors.minorhide');
  } else {
    tail.style.display = 'none';
  }

  pfPaintMeasureState(measured);

  if (pfSelKey && !major.some(function(r){ return r.key === pfSelKey; })) pfCloseDetail();
}

function pfToggleMinor(){ pfShowMinor = !pfShowMinor; renderColorGrid(); }

// ── medicao de uso: automatica ───────────────────────────────────────────────
// Antes isto era um botao escrito "Medir quanto cada cor ocupa do desenho". Duas
// coisas erradas com ele. Primeira: expunha uma decisao de implementacao - existem
// duas passadas por dentro (O19: a paleta do documento diz QUAIS cores existem em
// segundos, saber QUANTO cada uma ocupa exige percorrer as 16.899 formas) e isso e
// problema nosso, nao do operador. Segunda: sem a porcentagem a tabela nao serve
// para nada, porque o que o operador quer saber e qual cor domina o desenho - ou
// seja, o botao oferecia a unica coisa que fazia a tela valer a pena.
// Agora a medicao comeca sozinha assim que a lista rapida aparece, o ranking se
// forma ao vivo, e quem estiver com pressa pode parar.
var pfMeasureAsked = false, pfMeasuring = false;

function pfAutoMeasure(measured){
  if (measured || pfMeasureAsked || pfMeasuring || busy) return;
  pfMeasureAsked = true;
  pfMeasuring = true;
  pfStarted = Date.now();
  send({ cmd:'medirUso' });
}

function pfStopMeasure(){
  // Parar nao apaga o que ja foi medido: o ranking parcial continua na tela,
  // rotulado como parcial. Jogar fora trabalho ja feito seria gratuito.
  pfMeasuring = false;
  send({ cmd:'cancelar' });
  pfPaintMeasureState(false);
}

function pfPaintMeasureState(measured){
  var box = document.getElementById('pf-meas');
  var txt = document.getElementById('pf-meas-t');
  var stop = document.getElementById('pf-meas-x');
  if (!box) return;

  if (measured){ box.style.display = 'none'; return; }

  box.style.display = 'flex';
  if (pfMeasuring){
    txt.textContent = T('opt.pf.colors.measuring');
    stop.style.display = '';
  } else {
    txt.textContent = T('opt.pf.colors.measure.stopped');
    stop.style.display = 'none';
  }
}

// Ranking se formando ao vivo durante a medicao. Marcado como PARCIAL: um lider
// inicial ainda pode ser ultrapassado, e um numero que muda de ideia calado seria
// pior que numero nenhum.
function showColorPartial(d){
  lastColorTable = { rows: d.rows || [], palettes: (lastColorTable && lastColorTable.palettes) || [],
                     alerts: [], usageMeasured: true };
  document.getElementById('pf-result').style.display = 'block';
  document.getElementById('pf-partial').style.display = 'block';
  renderColorGrid();
}

function pfSetFilter(f){ pfFilter = f; renderColorGrid(); }

function pfCloseDetail(){
  pfSelKey = null;
  document.getElementById('pf-det').classList.remove('show');
  renderColorGrid();
}

function pfRow(key){
  if (!lastColorTable) return null;
  var hit = (lastColorTable.rows || []).filter(function(r){ return r.key === key; });
  return hit.length ? hit[0] : null;
}

function pfSelect(key){
  if (pfSelKey === key){ pfCloseDetail(); return; }
  pfSelKey = key;
  pfPickKey = null;
  var r = pfRow(key);
  if (!r) return;

  document.getElementById('pf-det-c').setAttribute('style', swatchCss(r));
  document.getElementById('pf-det-v').textContent = r.spotName || hexOf(r) || r.model;
  document.getElementById('pf-det-u').textContent =
    T('opt.pf.colors.uses', fmt(r.timesUsed), fmtPct(r.usage)) + (r.components ? '  ·  ' + r.components : '');
  var tag = document.getElementById('pf-det-tag');
  tag.className = 'pf-det-tag ' + (r.inPalette ? 'in' : 'out');
  tag.textContent = r.inPalette ? r.registeredAs : T('opt.pal.notregistered');

  renderPicks();
  document.getElementById('pf-target').value = '';
  document.getElementById('pf-det').classList.add('show');
  renderColorGrid();
  var det = document.getElementById('pf-det');
  if (det.scrollIntoView) det.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// Trocar ESCOLHENDO uma amostra da paleta - digitar hexadecimal e o ultimo
// recurso, nao o caminho principal.
function renderPicks(){
  var pals = (lastColorTable && lastColorTable.palettes) || [];
  var all = [];
  pals.forEach(function(p){ (p.Colors || p.colors || []).forEach(function(c){ all.push(c); }); });

  document.getElementById('pf-picks-wrap').style.display = all.length ? 'block' : 'none';
  if (!all.length) return;

  document.getElementById('pf-picks').innerHTML = all.map(function(c, i){
    var hex = hexClean(c.Hex || c.hex);
    var name = c.Name || c.name || '';
    return '<button class="pf-pick' + (pfPickKey === i ? ' on' : '') + '" '
         + 'style="' + (hex ? 'background:#' + esc(hex) : 'background:#ccc') + '" '
         + 'title="' + esc(name) + '" onclick="pfPick(' + i + ')"></button>';
  }).join('');
}

function pfPick(i){
  var pals = (lastColorTable && lastColorTable.palettes) || [];
  var all = [];
  pals.forEach(function(p){ (p.Colors || p.colors || []).forEach(function(c){ all.push(c); }); });
  var c = all[i];
  if (!c) return;

  pfPickKey = i;
  var model = c.Model || c.model || 'Rgb';
  var hex = hexClean(c.Hex || c.hex);
  pfSetMode(model === 'Cmyk' ? 'Cmyk' : 'Rgb');
  // CMYK cadastrado guarda "C10 M20 Y30 K40"; o campo aceita "10,20,30,40".
  var comp = c.Components || c.components || '';
  if (model === 'Cmyk' && comp){
    var nums = comp.match(/\d+/g) || [];
    document.getElementById('pf-target').value = nums.slice(0,4).join(',');
  } else {
    document.getElementById('pf-target').value = hex;
  }
  renderPicks();
}

function pfManualTyped(){ pfPickKey = null; renderPicks(); }

function pfSetMode(m){
  pfMode = m;
  document.getElementById('pf-mode-rgb').classList.toggle('on', m === 'Rgb');
  document.getElementById('pf-mode-cmyk').classList.toggle('on', m === 'Cmyk');
  var t = document.getElementById('pf-target');
  t.setAttribute('placeholder', T(m === 'Cmyk' ? 'opt.pf.replace.cmykph' : 'opt.pf.replace.hexph'));
}

function pfReplace(){
  if (busy || !pfSelKey) return;
  var raw = (document.getElementById('pf-target').value || '').trim();
  if (!raw) return;

  var scopeEl = document.querySelector('input[name="pf-scope"]:checked');
  var msg = { cmd:'colorReplace', sourceKey: pfSelKey, targetModel: pfMode,
              selectionOnly: scopeEl ? scopeEl.value === 'sel' : false };

  if (pfMode === 'Cmyk'){
    var parts = raw.split(',').map(function(s){ return parseInt(s.trim(), 10) || 0; });
    while (parts.length < 4) parts.push(0);
    msg.targetCmyk = parts.slice(0, 4);
  } else {
    var hex = raw.replace('#','');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    msg.targetRgb = [parseInt(hex.substring(0,2),16) || 0,
                     parseInt(hex.substring(2,4),16) || 0,
                     parseInt(hex.substring(4,6),16) || 0];
  }
  send(msg);
}

// A troca ja aconteceu no documento: dizer quantos objetos mudaram, e que a
// lista agora esta velha, e a diferenca entre "funcionou" e "sera que rodou?".
function showColorReplaced(d){
  var box = document.getElementById('pf-repl-r');
  if (box) box.style.display = '';

  if (!d.ok){
    if (box){
      box.className = 'pf-conv-r warn';
      box.textContent = d.unusableTarget ? T('opt.pal.apply.badtarget') : (d.error || '');
    }
    return;
  }

  // "Nada selecionado" e "essa cor não está aqui" davam os mesmos zeros. Agora o C# diz qual dos
  // dois foi, e a tela manda o operador para o lugar certo em vez de para o errado.
  if (d.selectionEmpty){
    if (box){ box.className = 'pf-conv-r warn'; box.textContent = T('opt.pal.apply.nosel'); }
    palShowError(T('opt.pal.apply.nosel'));
    return;
  }

  var n = (d.fillsChanged || 0) + (d.outlinesChanged || 0);
  var vistas = d.shapesInspected || 0;

  if (box){
    // Três causas para zero, três frases. Uma só ensina o operador a não ler nenhuma.
    if (n > 0){
      box.className = 'pf-conv-r';
      box.textContent = T('opt.pf.replace.result', fmt(n));
      if (d.notReplaceable > 0)
        box.textContent += ' ' + T('opt.pf.convert.left', fmt(d.notReplaceable));
    } else if (vistas === 0){
      box.className = 'pf-conv-r warn';
      box.textContent = T('opt.pf.convert.noshapes');
    } else {
      box.className = 'pf-conv-r warn';
      box.textContent = T('opt.pf.replace.noshapes', fmt(vistas));
    }
  }
  addLog('ColorReplace: ' + n + '/' + vistas, n > 0 ? 'ok' : 'warn');

  // A prova dos nove, igual à conversão: a tabela abaixo ainda descreve o documento de antes da
  // troca, e reler é o que transforma "mandei trocar" em "está trocado".
  if (n > 0){
    box.textContent += ' ' + T('opt.pf.convert.rechecking');
    setTimeout(function(){ if (!busy) auditar(); }, 250);
  } else {
    pfCloseDetail();
  }
}

function pfCapture(){
  var el = document.getElementById('pf-cap-name');
  var name = (el.value || '').trim();
  if (!name) { el.focus(); return; }
  send({ cmd:'paletteCapture', name: name });
  el.value = '';
}

function paletteRemove(name){ send({ cmd:'paletteRemove', name: name }); }

function renderPalettes(){
  // A barra de fora diz apenas CONTRA O QUE estamos conferindo. Sem paleta padrao
  // ela diz isso em vez de ficar calada, porque um alerta de "fora da paleta"
  // medido contra nada e uma acusacao sem regra declarada.
  var t = document.getElementById('pf-palbar-t');
  if (t){
    var active = palActive();
    t.innerHTML = active
      ? esc(T('opt.pal.active')) + ' <strong>' + esc(active) + '</strong>'
      : esc(T('opt.pal.none'));
    t.classList.toggle('none', !active);
  }
  if (palIsOpen()) palRender();
}

// ══ modal de paletas ════════════════════════════════════════════════════════
// ── converter o modo de cor do desenho ──────────────────────────────────────
// Pergunta antes. O número vem do censo das FORMAS (quantas cores estão realmente presas a
// objetos), não da paleta do documento, que lista cores que nenhum objeto usa (O19) — anunciar um
// número errado numa confirmação ensina o operador a não ler a confirmação.
var pfConvTarget = '';

function pfAskConvert(target){
  if (busy) return;
  pfConvTarget = target;
  var rows = (lastColorTable && lastColorTable.rows) || [];
  var alvo = target === 'Cmyk' ? 'Cmyk' : 'Rgb';
  var afetadas = rows.filter(function(r){ return r.model !== alvo; }).length;

  document.getElementById('pf-conv-q').textContent =
    T('opt.pf.bulk.ask', fmt(afetadas), alvo === 'Cmyk' ? 'CMYK' : 'RGB');
  document.getElementById('pf-conv-buttons').style.display = 'none';
  document.getElementById('pf-conv-ask').style.display = '';
}

function pfCancelConvert(){
  pfConvTarget = '';
  document.getElementById('pf-conv-ask').style.display = 'none';
  document.getElementById('pf-conv-buttons').style.display = '';
}

function pfDoConvert(){
  var t = pfConvTarget;
  pfCancelConvert();
  if (t) pfConvert(t);
}

function pfConvert(target){
  if (busy) return;
  // O escopo segue o mesmo controle que a substituicao ja usava, para "somente a
  // selecao" significar a mesma coisa nas duas acoes desta tela.
  var sel = document.querySelector('input[name="pf-scope"]:checked');
  send({ cmd:'convertColors', target: target, selectionOnly: !!(sel && sel.value === 'sel') });
}

function showConverted(d){
  var box = document.getElementById('pf-conv-r');
  if (!box) return;
  box.style.display = '';

  // Só relê quando algo mudou de verdade. Zero alterações significa que o documento está como já
  // estava — reler ali seria pagar uma passada de COM para confirmar que nada aconteceu.
  var mudou = d.ok && ((d.fillsChanged || 0) + (d.outlinesChanged || 0)) > 0;

  if (!d.ok){
    box.className = 'pf-conv-r warn';
    box.textContent = d.error || '';
    return;
  }

  var n = (d.fillsChanged || 0) + (d.outlinesChanged || 0);
  var label = d.target === 'Cmyk' ? 'CMYK' : 'RGB';
  var seen = d.shapesInspected || 0;

  // Zero mudancas tem TRES causas diferentes e a versao anterior afirmava uma
  // delas ("as cores ja estavam nesse modo") sem ter verificado - inclusive
  // quando nao havia lido forma nenhuma. Dizer a causa errada e pior que nao
  // dizer causa alguma: manda o operador procurar problema onde nao ha.
  if (seen === 0){
    box.className = 'pf-conv-r warn';
    box.textContent = T('opt.pf.convert.noshapes');
  } else if ((d.readFailed || 0) > 0 || (d.convertFailed || 0) > 0){
    // Uma falha de COM produzia os mesmos zeros que um desenho ja no modo certo.
    // Agora ela tem contador proprio e diz o erro, em vez de se disfarcar de
    // "nada a fazer" - que foi o que mandou o operador procurar problema onde
    // nao havia.
    box.className = 'pf-conv-r warn';
    box.textContent = T('opt.pf.convert.failed',
      fmt((d.readFailed || 0) + (d.convertFailed || 0))) + (d.error ? ' (' + d.error + ')' : '');
  } else if (n === 0 && (d.alreadyInMode || 0) > 0){
    box.className = 'pf-conv-r warn';
    box.textContent = T('opt.pf.convert.already', fmt(d.alreadyInMode), label);
    // O censo vem das FORMAS; a auditoria conta pela paleta do documento, que
    // super-reporta. Mostrar os dois numeros e o que encerra a duvida de "mas o
    // Optimus disse que tinha RGB".
    if (d.census) box.textContent += ' ' + T('opt.pf.convert.census', d.census);
  } else if (n === 0){
    box.className = 'pf-conv-r warn';
    box.textContent = T('opt.pf.convert.nothing', fmt(seen));
  } else {
    box.className = 'pf-conv-r';
    box.textContent = T('opt.pf.convert.done', fmt(n), label);
  }

  // O que NAO deu para converter e dito sempre. Uma conversao que deixa metade do
  // desenho no modo antigo em silencio e pior que uma que se recusa a rodar.
  if (d.notConvertible > 0){
    box.className = 'pf-conv-r warn';
    box.textContent += ' ' + T('opt.pf.convert.left', fmt(d.notConvertible));
  }

  // A prova dos nove. A tela abaixo ainda descreve o documento de antes da conversão; reler é o que
  // troca "mandei converter" por "está convertido". O adiamento existe porque a passada anterior
  // ainda está encerrando do lado do C# — disparar em cima cairia no guarda de ocupado e não faria
  // nada, silenciosamente.
  if (mudou){
    box.textContent += ' ' + T('opt.pf.convert.rechecking');
    setTimeout(function(){ if (!busy) auditar(); }, 250);
  }
}

// Um X desenhado, para as ações caberem em 340px sem depender de fonte de ícones — a página roda
// sem internet e sem webfont por regra do produto.
var ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" '
  + 'stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// ── o rótulo que a gráfica usa ──────────────────────────────────────────────
// HEX não serve para acertar máquina. Quem vai imprimir precisa da SEPARAÇÃO: uma cor CMYK se lê em
// C/M/Y/K porque é assim que ela vira tinta, e uma spot se lê pelo NOME da tinta, que é o único
// dado que ela realmente carrega. HEX fica como último recurso, para cor que não deu para
// identificar — melhor um código do que um traço.
function palColorLabel(c){
  var spot = c.SpotName || c.spotName || '';
  if (spot) return spot;

  var comp = c.Components || c.components || '';
  var model = String(c.Model || c.model || '');

  if (model === 'Cmyk'){
    // O C# escreve "C0 M0 Y0 K100"; aqui vira "C:0 M:0 Y:0 K:100", que é como a chapa é rotulada.
    if (comp) return comp.replace(/([CMYK])\s*/g, '$1:');
    return '';
  }

  var h = hexClean(c.Hex || c.hex);
  if (model === 'Rgb' && h)
    return 'R:' + parseInt(h.substr(0,2),16)
         + ' G:' + parseInt(h.substr(2,2),16)
         + ' B:' + parseInt(h.substr(4,2),16);

  return h ? '#' + h : (model || '');
}

// ── editor da cor escolhida ─────────────────────────────────────────────────
// Só existe para a paleta ativa: renomear ou remover uma cor de uma paleta que não está valendo é
// uma ação sem consequência visível, e oferecer isso em todas as paletas ao mesmo tempo enche a
// tela de controles que não fazem nada agora.
var palSelKey = '';

function palPickColor(palette, key){
  palSelKey = (palSelKey === key) ? '' : key;
  palRender();
}

function palColorEditor(palette, cols){
  if (!palSelKey) return '';
  var c = null;
  for (var i = 0; i < cols.length; i++){
    if ((cols[i].Key || cols[i].key) === palSelKey) { c = cols[i]; break; }
  }
  if (!c) return '';

  var h = hexClean(c.Hex || c.hex);
  var nome = c.Name || c.name || '';
  return '<div class="pal-edit">'
    + '<span class="pal-edit-sw" style="background:' + (h ? '#' + esc(h) : '#ccc') + '"></span>'
    + '<div class="pal-edit-b">'
      // O valor de separação em mono: é um número para conferir com a gráfica.
      + '<div class="pal-edit-v">' + esc(palColorLabel(c)) + '</div>'
      // O nome é um campo de verdade, sem moldura até receber foco. Uma cor chamada "dave" precisa
      // poder virar "vinho do cliente" sem sair da tela.
      + '<input class="pal-edit-n" type="text" value="' + esc(nome) + '"'
        + ' placeholder="' + esc(T('opt.pal.modal.addname')) + '"'
        + ' onblur="palRenameColor(' + jsq(palette) + ',' + jsq(palSelKey) + ',this.value)"'
        + ' onkeydown="if(event.key===\'Enter\')this.blur()">'
    + '</div>'
    + '<button class="pal-edit-x" onclick="palRemoveColor(' + jsq(palette) + ',' + jsq(palSelKey) + ')"'
      + ' title="' + esc(T('opt.pal.modal.delcolor')) + '"'
      + ' aria-label="' + esc(T('opt.pal.modal.delcolor')) + '">' + ICON_X + '</button>'
  + '</div>'
  + palApplyBlock(palette);
}

// ── usar a cor no desenho ───────────────────────────────────────────────────
// A paleta entrega a cor de DESTINO e nada mais. Qual cor está sendo trocada e se o alcance é a
// seleção ou o desenho inteiro continuam sendo o que a aba de Cores já decide — a paleta não ganha
// uma segunda interpretação dessas duas coisas, senão passam a existir dois produtos.
var palAskingKey = '';

function palApplyBlock(palette){
  if (palAskingKey !== palSelKey)
    return '<div class="pal-acts">'
      + '<button class="pal-act" onclick="palApplyStart(' + jsq(palette) + ')">'
      + esc(T('opt.pal.apply')) + '</button></div>';

  return '<div class="bulk-confirm mt-3">'
    + '<div class="bulk-q">' + esc(palApplyQuestion()) + '</div>'
    // A perda vai no RÓTULO, não num rodapé: quem aplica precisa saber, antes de clicar, que o
    // contorno não acompanha.
    + '<div class="pf-note border-0">' + esc(T('opt.pal.apply.fill')) + '</div>'
    + '<div class="bulk-b">'
      + '<button class="btn-quiet" onclick="palApplyCancel()">' + esc(T('opt.pf.bulk.cancel')) + '</button>'
      + '<button class="btn-primary" onclick="palApplyGo(' + jsq(palette) + ')">'
        + esc(T('opt.pal.apply.go')) + '</button>'
    + '</div></div>';
}

function palScopeIsSelection(){
  var el = document.querySelector('input[name="pf-scope"]:checked');
  return !!(el && el.value === 'sel');
}

// A pergunta diz o IMPACTO — quantos objetos, ou que a troca vale para o desenho todo. Uma
// confirmação que não diz o tamanho do estrago ensina a clicar em "sim" sem ler.
function palApplyQuestion(){
  if (!palScopeIsSelection()) return T('opt.pal.apply.askall');
  return selCount === 1 ? T('opt.pal.apply.ask1') : T('opt.pal.apply.askn', fmt(selCount));
}

function palApplyStart(palette){
  if (busy) return;

  // Sem cor de origem não há troca: a paleta diz para onde ir, a aba de Cores diz de onde sair.
  if (!pfSelKey){ palShowError(T('opt.pal.apply.nosource')); return; }
  if (palScopeIsSelection() && selCount === 0){ palShowError(T('opt.pal.apply.nosel')); return; }

  palShowError('');
  if (!palConfirmApply){ palApplyGo(palette); return; }
  palAskingKey = palSelKey;
  palRender();
}

function palApplyCancel(){
  // Cancelar não muda documento, não muda paleta, não dispara evento nenhum.
  palAskingKey = '';
  palRender();
}

function palApplyGo(palette){
  palAskingKey = '';
  palRender();
  if (busy || !pfSelKey || !palSelKey) return;
  send({ cmd:'paletteApply', palette: palette, key: palSelKey,
         sourceKey: pfSelKey, selectionOnly: palScopeIsSelection() });
}

var palConfirmApply = true;

function palConfirmToggle(on){
  palConfirmApply = !!on;
  send({ cmd:'paletteConfirmSet', on: palConfirmApply });
}

// ── recusas ─────────────────────────────────────────────────────────────────
function palShowError(text){
  var box = document.getElementById('pal-err');
  if (!box) return;
  box.textContent = text || '';
  box.style.display = text ? '' : 'none';
}

// A TABLE, not a key built by concatenating the code onto a prefix. A computed key cannot be checked
// by the build gate, and that gate is exactly what stops a screen from showing the key name where a
// sentence belongs. An unknown code lands on a real sentence, never on "undefined".
function palErrorText(code){
  if (code === 'NameTaken') return T('opt.pal.err.NameTaken');
  if (code === 'ColorAlreadyInPalette') return T('opt.pal.err.ColorAlreadyInPalette');
  if (code === 'InvalidName') return T('opt.pal.err.InvalidName');
  if (code === 'UnreadableFile') return T('opt.pal.err.UnreadableFile');
  if (code === 'NoColors') return T('opt.pal.err.NoColors');
  return T('opt.pal.err.NotFound');
}

function showPaletteError(d){
  if (!palIsOpen()) palOpen();
  palShowError(palErrorText(d.code));
}

function palRenameColor(palette, key, nome){
  if (!key) return;
  send({ cmd:'paletteColorRename', palette: palette, key: key, name: (nome || '').trim() });
}

function palIsOpen(){
  var m = document.getElementById('pal-modal');
  return !!m && !m.hidden;
}

function palOpen(){
  var m = document.getElementById('pal-modal');
  if (!m) return;
  m.hidden = false;
  // Pede a lista ao abrir: e o unico jeito de a tela estar certa quando nada foi analisado ainda.
  send({ cmd:'paletteList' });
  palRender();
  var f = document.getElementById('pal-new-name');
  if (f) f.focus();
}

function palClose(){
  var m = document.getElementById('pal-modal');
  if (m) m.hidden = true;
}

// Estado proprio das paletas, alimentado pelo evento 'palettes'. Antes elas viajavam DENTRO da
// mensagem da tabela de cores, que sai vazia quando nao ha arquivo analisado - por isso cadastrar
// uma paleta antes de analisar nao mudava nada na tela.
var palState = { palettes: [], active: '' };

function showPalettes(d){
  palState.palettes = d.palettes || [];
  palState.active = d.activePalette || '';

  // Este evento só chega DEPOIS de uma gravação bem-sucedida, então é o momento certo de apagar a
  // recusa anterior: o que estava errado deixou de estar.
  palShowError('');

  if (typeof d.confirmApply === 'boolean'){
    palConfirmApply = d.confirmApply;
    var chk = document.getElementById('pal-confirm');
    if (chk) chk.checked = palConfirmApply;
  }
  renderPalettes();
}

// ── importar de um SVG ──────────────────────────────────────────────────────
// O SVG é fonte de cor e nada mais: sem convenção de metadado, sem JSON escondido dentro do
// arquivo, sem exigir nada do designer que o exportou.
var svgReady = null;

function svgPick(){ if (!busy) send({ cmd:'svgPick' }); }

function showSvgColors(d){
  if (!d.ok){ svgCancel(); palShowError(palErrorText(d.code || 'UnreadableFile')); return; }

  svgReady = d;
  palShowError('');
  var box = document.getElementById('pal-svg');
  if (box) box.style.display = '';

  document.getElementById('pal-svg-t').textContent =
    T('opt.pal.svg.found', fmt((d.colors || []).length), d.file || '');

  // Menções e cores são números diferentes, e dizer os dois é o que impede "só achou 6?" quando o
  // arquivo mencionava a mesma cor quarenta vezes.
  document.getElementById('pal-svg-note').textContent =
    T('opt.pal.svg.foundnote', fmt(d.mentions || 0), fmt((d.colors || []).length))
    + '  ' + T('opt.pal.svg.nonames');

  document.getElementById('pal-svg-grid').innerHTML = (d.colors || []).map(function(h){
    return '<span class="sw" style="background:#' + esc(h) + '" title="#' + esc(h) + '"></span>';
  }).join('');

  var f = document.getElementById('pal-svg-name');
  if (f){ f.value = ''; f.focus(); }
}

function svgImport(){
  var el = document.getElementById('pal-svg-name');
  var name = el ? el.value.trim() : '';
  // Nome obrigatório: uma paleta sem nome não dá para escolher depois.
  if (!name){ palShowError(T('opt.pal.err.InvalidName')); if (el) el.focus(); return; }
  send({ cmd:'svgImport', name: name });
}

function svgCancel(){
  svgReady = null;
  var box = document.getElementById('pal-svg');
  if (box) box.style.display = 'none';
}

function showSvgImported(d){
  svgCancel();
  if (!d.ok) return;
  addLog(T('opt.pal.svg.done', d.name, fmt(d.count || 0)), 'ok');
}

function palPalettes(){ return palState.palettes; }
function palActive(){ return palState.active; }
function palName(p){ return p.Name || p.name || ''; }
function palColors(p){ return p.Colors || p.colors || []; }

function palRender(){
  var host = document.getElementById('pal-list');
  if (!host) return;

  var pals = palPalettes();
  var active = palActive();

  if (!pals.length){
    host.innerHTML = '<div class="pf-note border-0 py-3">'
                   + esc(T('opt.pal.modal.empty')) + '</div>';
    return;
  }

  var docCols = palDocColors();

  host.innerHTML = pals.map(function(p){
    var name = palName(p);
    var cols = palColors(p);
    var isOn = name.toLowerCase() === String(active).toLowerCase();
    var q = jsq(name);

    // Em confirmação, o cartão mostra SÓ a pergunta. Deixar a grade e os botões no ar ao lado dela
    // convida a continuar mexendo enquanto uma pergunta destrutiva está aberta.
    if (palDelAsk && palDelAsk.toLowerCase() === name.toLowerCase())
      return '<div class="pal-card danger">'
        + '<div class="bulk-t">'
          + '<span class="status-ic status-warn" aria-hidden="true">!</span>'
          + '<span>' + esc(T('opt.pal.modal.delpal')) + '</span>'
        + '</div>'
        + '<div class="bulk-q">' + esc(T('opt.pal.modal.delask', name, fmt(cols.length))) + '</div>'
        + '<div class="bulk-b">'
          + '<button class="btn-quiet" onclick="palCancelDelete()">'
            + esc(T('opt.pf.bulk.cancel')) + '</button>'
          + '<button class="btn-danger" onclick="palConfirmDelete(' + q + ')">'
            + esc(T('opt.pal.modal.delgo')) + '</button>'
        + '</div>'
      + '</div>';

    return '<div class="pal-card' + (isOn ? ' on' : '') + '">'
      // Cabeçalho: nome, estado, e a remoção da paleta inteira.
      + '<div class="pal-card-h">'
        + '<span class="pal-card-n">' + esc(name) + '</span>'
        + (isOn
            ? '<span class="pal-badge">' + esc(T('opt.pal.modal.default')) + '</span>'
            : '<button class="pal-set" onclick="palSetActive(' + q + ')">'
              + esc(T('opt.pal.modal.setdefault')) + '</button>')
        + '<button class="pal-del" onclick="palAskDelete(' + q + ')" title="'
          + esc(T('opt.pal.modal.delpal')) + '" aria-label="' + esc(T('opt.pal.modal.delpal')) + '">'
          + ICON_X + '</button>'
      + '</div>'
      + '<div class="pal-count">'
        + esc(cols.length ? T('opt.pal.modal.colors', cols.length) : T('opt.pal.modal.nocolors'))
      + '</div>'

      // A MESMA grade da aba de Cores. Blocos grandes aqui não davam nenhuma informação a mais e
      // faziam uma paleta de dez cores precisar de rolagem.
      + (cols.length
          ? '<div class="sw-grid pal-grid">' + cols.map(function(c){
              var h = hexClean(c.Hex || c.hex);
              var key = c.Key || c.key || '';
              var sel = palSelKey === key;
              return '<button class="sw' + (sel ? ' on' : '') + '"'
                   + ' style="background:' + (h ? '#' + esc(h) : '#ccc') + '"'
                   + ' title="' + esc(palColorLabel(c)) + '"'
                   + ' onclick="palPickColor(' + q + ',' + jsq(key) + ')"></button>';
            }).join('') + '</div>'
          : '')

      // Detalhe sob demanda: os valores de separação, o nome editável e a remoção. Mesmo padrão da
      // aba principal — a grade é para varrer, o detalhe é para decidir.
      + (isOn ? palColorEditor(name, cols) : '')

      + '<div class="pal-acts">'
        + '<button class="pal-act" onclick="palPickNew(' + q + ')">'
          + '<span class="pal-act-sw" aria-hidden="true"></span>'
          + esc(T('opt.pal.modal.pick')) + '</button>'
        + (docCols.length
            ? '<button class="pal-act" onclick="palFromDocOpen(' + q + ')">'
              + esc(T('opt.pal.modal.fromdoc2', docCols.length)) + '</button>'
            : '')
      + '</div>'
    + '</div>';
  }).join('')
  + (docCols.length ? '' : '<div class="pf-note border-0 pt-3">'
      + esc(T('opt.pal.modal.nodoc')) + '</div>');
}

// As cores que o desenho aberto tem. Antes o botão consultava lastColorTable.rows e ficava
// DESABILITADO sempre que a tabela vinha vazia — o que acontecia toda vez que a medição de uso
// falhava e devolvia zero cores. O operador via um botão morto sem explicação nenhuma.
function palDocColors(){
  var rows = (lastColorTable && lastColorTable.rows) || [];
  return rows.filter(function(r){ return r && r.rgbKnown; });
}

// ── seletor visual ──────────────────────────────────────────────────────────
// vanilla-picker embutido. Cor se escolhe olhando; digitar hex é o último recurso, não o primeiro
// (o campo hex continua existindo DENTRO do seletor, para quem tem o código da marca na mão).
// A cor corrente e guardada pelo onChange, que e o caminho documentado da biblioteca. Ler um
// campo interno da instancia funcionaria hoje e quebraria na proxima versao dela sem aviso.
var palPickerFor = '', palPickerObj = null, palPickerHex = 'C2410C';

function palPickNew(palette){
  palPickerFor = palette;
  var host = document.getElementById('pal-picker-host');
  var box = document.getElementById('pal-picker');
  if (!host || !box) return;

  box.style.display = '';
  document.getElementById('pal-picker-name').value = '';
  document.getElementById('pal-picker-t').textContent = T('opt.pal.modal.picktitle', palette);

  if (!palPickerObj){
    palPickerObj = new Picker({
      parent: host,
      popup: false,      // inline in the panel, not floating: the docker is only 340px wide
      alpha: false,      // ink has no transparency
      editor: true,      // keeps the hex field for whoever already has the brand code
      color: '#C2410C'
    });
    palPickerObj.onChange = function(c){
      palPickerHex = hexClean(c.hex);
      var el = document.getElementById('pal-picker-prev');
      if (el) el.style.background = '#' + palPickerHex;
    };
  }
  palPickerHex = 'C2410C';
  palPickerObj.setColor('#C2410C', true); // true = silencioso, nao dispara onChange
  var prev = document.getElementById('pal-picker-prev');
  if (prev) prev.style.background = '#C2410C';
}

function palPickerConfirm(){
  if (!palPickerObj || !palPickerFor) return;
  var hex = palPickerHex;
  if (!hex) return;
  var nm = document.getElementById('pal-picker-name');
  send({ cmd:'paletteColorAddManual', palette: palPickerFor, hex: hex,
         colorName: nm ? nm.value.trim() : '' });
  palPickerClose();
}

function palPickerClose(){
  var box = document.getElementById('pal-picker');
  if (box) box.style.display = 'none';
  palPickerFor = '';
}

// ── escolher do desenho ─────────────────────────────────────────────────────
// Antes era um botão "trazer TODAS as cores deste arquivo". Num desenho com 91 cores isso enche a
// paleta do cliente de lixo. Agora é uma grade onde se marca o que interessa.
var palDocFor = '', palDocSel = {};

function palFromDocOpen(palette){
  palDocFor = palette;
  palDocSel = {};
  var box = document.getElementById('pal-doc');
  if (!box) return;
  box.style.display = '';
  document.getElementById('pal-doc-t').textContent = T('opt.pal.modal.doctitle', palette);
  palDocRender();
}

function palDocRender(){
  var host = document.getElementById('pal-doc-grid');
  if (!host) return;
  host.className = 'pal-doc-grid sw-grid';
  host.innerHTML = palDocColors().map(function(r, i){
    var on = !!palDocSel[r.key];
    return '<div class="pal-doc-i">'
      + '<button class="pal-doc-c' + (on ? ' on' : '') + '" onclick="palDocToggle(' + i + ')"'
        + ' style="' + swatchCss(r) + '" title="' + esc(colorValue(r)) + '">'
        + (on ? '<span class="pal-doc-tick">' + SEV_GLYPH.ok + '</span>' : '') + '</button>'
      // The number is WRITTEN under the swatch, not hidden in a tooltip. Anyone working with print
      // needs the value to check against the printer, and nobody checks by hovering one swatch at
      // a time.
      + '<span class="pal-doc-v">' + esc(colorValue(r)) + '</span>'
      + '</div>';
  }).join('');
  var n = Object.keys(palDocSel).length;
  var go = document.getElementById('pal-doc-go');
  if (go){ go.disabled = n === 0; go.textContent = T('opt.pal.modal.docadd', n); }
}

// O valor que o operador precisa depende do modo da cor: uma CMYK e conferida com a grafica em
// C/M/Y/K, uma RGB em hexadecimal, e uma cor especial pelo NOME da tinta - que e o unico dado que
// importa nela.
function colorValue(r){
  if (!r) return '';
  if (r.spotName) return r.spotName;
  if (r.model === 'Cmyk' && r.components) return r.components;
  var h = hexOf(r);
  return h || r.model || '';
}

function palDocToggle(i){
  var r = palDocColors()[i];
  if (!r) return;
  if (palDocSel[r.key]) delete palDocSel[r.key]; else palDocSel[r.key] = r;
  palDocRender();
}

function palDocConfirm(){
  var keys = Object.keys(palDocSel);
  if (!keys.length || !palDocFor) return;
  // Um comando por cor: o host já sabe adicionar uma, e reaproveitar isso evita um caminho novo
  // no C# que precisaria da mesma validação de novo.
  //
  // 'paletteColorAdd' (por CHAVE) é o único caminho certo aqui: a linha 'r' já carrega a
  // identidade exata lida do documento (modelo, hex e componentes CMYK). O caminho antigo
  // ('paletteColorAddManual', só hex) jogava tudo isso fora e recalculava o hex a partir do RGB
  // de TELA — para uma cor CMYK isso produz uma chave 'Rgb|HEX' que NUNCA bate com a chave
  // 'Cmyk|HEX+componentes' que a auditoria lê do mesmo objeto. Resultado medido: escolher a cor
  // exata da grade e, na próxima análise, vê-la marcada como FORA DA PALETA — um hex idêntico
  // reprovando contra si mesmo porque o modelo da cor tinha sido trocado por engano no caminho.
  keys.forEach(function(k){
    var r = palDocSel[k];
    if (r && r.key) send({ cmd:'paletteColorAdd', palette: palDocFor, key: r.key,
                            name: r.registeredAs || '' });
  });
  palDocClose();
}

function palDocClose(){
  var box = document.getElementById('pal-doc');
  if (box) box.style.display = 'none';
  palDocFor = ''; palDocSel = {};
}

// Um nome de paleta vai parar dentro de um atributo onclick, entao precisa passar
// por aspas simples E por escape de HTML. Fazer so um dos dois quebra em "Cliente
// D'Angelo" - e nomes de cliente tem apostrofo com frequencia desconfortavel.
function jsq(v){
  return "'" + String(v == null ? '' : v)
    .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') + "'";
}

function slug(v){ return String(v || '').replace(/[^A-Za-z0-9]/g, ''); }

function palCreate(){
  var el = document.getElementById('pal-new-name');
  var name = el ? el.value.trim() : '';
  if (!name) { if (el) el.focus(); return; }
  if (el) el.value = '';
  send({ cmd:'paletteAdd', name: name });
}

// Uma paleta por vez em confirmação: duas perguntas destrutivas abertas ao mesmo tempo é a receita
// para responder a errada.
var palDelAsk = '';

function palAskDelete(name){ palDelAsk = name; palSelKey = ''; palRender(); }
function palCancelDelete(){ palDelAsk = ''; palRender(); }

function palConfirmDelete(name){
  palDelAsk = '';
  send({ cmd:'paletteRemove', name: name });
}
function palSetActive(name){ send({ cmd:'paletteSetActive', name: name }); }
function palRemoveColor(pal, key){
  if (!key) return;
  palSelKey = '';   // a cor deixou de existir; manter o editor aberto nela seria editar um fantasma
  send({ cmd:'paletteColorRemove', name: pal, key: key });
}

function palAddColor(pal){
  var hx = document.getElementById('pal-hx-' + slug(pal));
  var nm = document.getElementById('pal-nm-' + slug(pal));
  var hex = hexClean(hx ? hx.value : '');
  if (!hex) { if (hx) hx.focus(); return; }
  send({ cmd:'paletteColorAddManual', palette: pal, hex: hex, colorName: nm ? nm.value.trim() : '' });
  if (hx) hx.value = '';
  if (nm) nm.value = '';
}

function palFromDoc(pal){ send({ cmd:'paletteCapture', name: pal }); }

// ── fontes ─────────────────────────────────────────────────
// A fonte que nao escreve "ç" e o achado que salva uma tiragem, entao ela vem
// primeiro. O nome desenhado NA propria fonte e a prova visual.
function showFontManager(d){ lastFontMgr = d; renderFonts(); }

function renderFonts(){
  var used = (lastAudit && lastAudit.fonts) || [];
  var reg  = (lastFontMgr && lastFontMgr.fonts) || [];

  var seen = {}, all = [];
  used.forEach(function(f){ seen[f.name.toLowerCase()] = 1; all.push({ f:f, registered:false }); });
  reg.forEach(function(f){ if (!seen[f.name.toLowerCase()]) all.push({ f:f, registered:true }); });

  var rank = { Failed:0, NotInstalled:1, Warning:2, Ok:3, SymbolFont:4 };
  all.sort(function(a,b){ return (rank[a.f.verdict] || 9) - (rank[b.f.verdict] || 9); });

  document.getElementById('pf-fonts-n').textContent = fmt(all.length);
  document.getElementById('pf-fonts').innerHTML = all.length === 0
    ? '<div class="pf-note">' + esc(T('opt.font.empty')) + '</div>'
    : all.map(function(it){
        var f = it.f;
        var cls = (f.verdict === 'Failed' || f.verdict === 'NotInstalled') ? 'err'
                : f.verdict === 'Warning' ? 'warn'
                : f.verdict === 'SymbolFont' ? 'sym' : 'ok';
        // O nome da fonte era desenhado na propria fonte via font-family - o que so
        // funciona quando a fonte esta instalada no Windows. Justamente as fontes
        // que INTERESSAM (a que falta, a do Corel Font Manager) caiam no fallback e
        // apareciam em Segoe UI, ou seja, a "prova visual" mostrava a fonte errada.
        // Agora os bytes vem do C# e a amostra e a fonte de verdade.
        var slug = fontSlug(f.name);
        return '<div class="pf-font ' + cls + '" id="fo-' + slug + '">'
             + '<span class="fo-ic" aria-hidden="true">' + (SEV_GLYPH[cls] || '') + '</span>'
             + '<span class="fo-b">'
             + '<div class="fo-n">' + esc(f.name) + '</div>'
             + '<div class="fo-s">' + esc(f.summary || '') + '</div>'
             + '<div class="fo-sp" id="sp-' + slug + '" aria-label="'
               + esc(T('opt.pf.font.preview')) + '">' + esc(foSample()) + '</div>'
             + '</span></div>';
      }).join('');

  // Um pedido por fonte, e so uma vez cada. Os bytes viajam em base64, que infla um
  // terco, entao repedir a cada redesenho da lista seria caro sem mudar nada na tela.
  all.forEach(function(it){ requestFontPreview(it.f.name); });
}

// ══ especimen da fonte ══════════════════════════════════════════════════════
// Dizer "Acentos do portugues OK" pede que o operador acredite em nos. Desenhar
// "coracao" na fonte de verdade deixa ele VER - e quando falta um glifo aparece o
// quadradinho, que e exatamente o que o CorelDRAW vai mandar para a impressao.
// A verificacao por cmap continua sendo o que escala para o documento inteiro; o
// especimen e o que torna o veredito acreditavel.
// Amostra vinda do catalogo: cada idioma confere as SUAS letras.
function ptSample(){ return T('opt.pf.font.sample'); }

// ── texto de amostra ────────────────────────────────────────────────────────
// Um estado só, compartilhado por todas as prévias: a comparação entre duas fontes só vale se as
// duas estiverem escrevendo a MESMA palavra. Nada disso é gravado — é o que se quer ver agora, não
// uma preferência. E nada disso cria objeto no documento do CorelDRAW: a prova é aqui na tela.
var foText = '', foTimer = null;

function foSample(){ return foText.trim() ? foText : ptSample(); }

// Mesmo debounce da estimativa (250 ms): redesenhar a lista inteira a cada tecla é trabalho que
// ninguém vê, e numa máquina de gráfica isso aparece como digitação travando.
function foTextTyped(){
  if (foTimer) clearTimeout(foTimer);
  foTimer = setTimeout(function(){
    foTimer = null;
    var el = document.getElementById('fo-text');
    foText = el ? el.value : '';
    foApplySample();
  }, 250);
}

function foApplySample(){
  var s = foSample();
  var nodes = document.querySelectorAll('.fo-sp');
  for (var i = 0; i < nodes.length; i++){
    // Uma amostra que NÃO deu para desenhar carrega o motivo escrito nela. Sobrescrever isso com o
    // texto do operador diria, numa fonte de fallback, que a fonte ausente escreve bem.
    if (nodes[i].classList.contains('fail')) continue;
    nodes[i].textContent = s;
  }
}

var fontAsked = {};

function fontSlug(name){ return String(name || '').replace(/[^A-Za-z0-9]/g, ''); }

function requestFontPreview(name){
  var slug = fontSlug(name);
  if (!slug || fontAsked[slug]) return;
  fontAsked[slug] = 1;
  send({ cmd:'fontPreview', family: name });
}

function showFontPreview(d){
  var slug = fontSlug(d.family);
  var el = document.getElementById('sp-' + slug);
  if (!el) return;

  if (!d.ok || !d.data){
    // Nao ter conseguido desenhar a fonte NAO e um problema com a fonte, e uma
    // limitacao nossa - entao a linha diz isso, em vez de sumir e dar a impressao
    // de que o veredito mudou.
    el.classList.add('fail');
    el.textContent = T('opt.pf.font.previewfail');
    return;
  }

  // Nome interno proprio: registrar a face com o nome real da familia sobrescreveria
  // a fonte instalada dentro desta pagina, e ai a amostra de uma fonte poderia
  // acabar desenhando outra.
  var face = 'opsp-' + slug;
  if (!fontAsked['css-' + slug]){
    fontAsked['css-' + slug] = 1;
    var css = document.createElement('style');
    css.textContent = '@font-face{font-family:"' + face + '";src:url(data:'
      + (d.mime || 'font/ttf') + ';base64,' + d.data + ');font-display:block}';
    document.head.appendChild(css);
  }

  el.style.fontFamily = '"' + face + '", serif';
  el.classList.add('on');
}

// Pasta de fontes, no modelo do Corel Font Manager: as fontes ficam num diretorio e sao
// lidas dali, SEM instalar nada no Windows. Por isso o gesto certo e apontar a PASTA -
// colar uma lista de nomes nao diz onde a fonte esta nem se ela escreve portugues.
var lastFontFolder = null;

function pfPickFolder(){ if (!busy) send({ cmd:'fontFolderPick' }); }

function showFontFolder(d){
  lastFontFolder = d;
  var has = d.folder && d.folder.length > 0;
  document.getElementById('pf-folder-note').style.display = has ? 'none' : 'block';
  document.getElementById('pf-folder-path').textContent = has ? d.folder : '';
  document.getElementById('pf-folder-btn').textContent = T(has ? 'opt.pf.fonts.change' : 'opt.pf.fonts.pick');

  var list = document.getElementById('pf-folder-list');
  if (!has){ list.innerHTML = ''; return; }

  if (!d.ok){
    list.innerHTML = '<div class="pf-note">' + esc(T('opt.pf.fonts.foldererr', d.error || '?')) + '</div>';
    return;
  }

  var fonts = (d.fonts || []).slice();
  var rank = { Failed:0, NotInstalled:1, Warning:2, Ok:3, SymbolFont:4 };
  fonts.sort(function(a,b){ return (rank[a.verdict]||9) - (rank[b.verdict]||9); });
  var bad = fonts.filter(function(f){ return f.verdict === 'Failed'; }).length;

  list.innerHTML =
      '<div class="pf-note">' + esc(T('opt.pf.fonts.folderinfo', fmt(fonts.length), fmt(bad))) + '</div>'
    + fonts.map(function(f){
        var cls = f.verdict === 'Failed' ? 'err' : f.verdict === 'Warning' ? 'warn'
                : f.verdict === 'SymbolFont' ? 'sym' : 'ok';
        return '<div class="pf-font ' + cls + '"><span class="fo-ic" aria-hidden="true">' + (SEV_GLYPH[cls] || '') + '</span><span class="fo-b">'
             + '<div class="fo-n" style="font-family:' + esc(JSON.stringify(String(f.name))) + '">' + esc(f.name) + '</div>'
             + '<div class="fo-s">' + esc(f.summary || '') + '</div></span></div>';
      }).join('');
}

// ── abas ───────────────────────────────────────────────────
// Tres destinos agora: otimizar, cores, fontes. Escrito sobre uma LISTA em vez de pares de
// ifs - com dois destinos o if servia, com tres ele vira uma teia de negacoes.
var TABS = ['opt', 'cores', 'fontes'];

// ══ MÁQUINA DE ESTADOS DA ABA OTIMIZAR ═════════════════════════════════════
// Derivada dos DADOS, nunca de um sinalizador guardado à parte: um estado guardado à mão sai de
// sincronia com o que a tela realmente tem para mostrar, e aí um bloco vazio aparece sem que nada
// no código pareça errado.
var OPT_BLOCKS = {
  welcome: 'opt-welcome',
  modes:   'opt-modes',
  estEmpty:'est-empty',
  est:     'est',
  adv:     'acc-h',
  advBody: 'acc-body',
  scanOpts:'opt-scan',
  scan:    'scan-row',
  inv:     'inv',
  result:  'result'
};

function optState(){
  if (lastRun && lastRun.ok) return 'resultado';
  if (lastInv) return 'config';
  return 'vazio';
}

function show(id, on){
  var el = document.getElementById(id);
  if (!el) return;
  // The accordion body has its own owner (toggleAdvanced); the state machine may close it, never open it.
  if (id === 'acc-body') { if (!on) el.hidden = true; return; }
  el.style.display = on ? '' : 'none';
}

function renderOptState(){
  var st = optState();

  // vazio: só a mensagem e o caminho para sair dela. Nada de oferecer "resultado previsto" de um
  // arquivo que ninguém leu ainda.
  show(OPT_BLOCKS.welcome, st === 'vazio');
  show(OPT_BLOCKS.modes, st !== 'vazio');
  show(OPT_BLOCKS.adv, st !== 'vazio');
  show(OPT_BLOCKS.inv, st === 'config' || st === 'resultado');
  show(OPT_BLOCKS.result, st === 'resultado');

  // A estimativa tem os dois estados dela própria; aqui só decidimos se ela existe.
  var temEst = !!(lastEstimate && lastEstimate.ok);
  show(OPT_BLOCKS.estEmpty, st !== 'vazio' && !temEst);
  show(OPT_BLOCKS.est, st !== 'vazio' && temEst);

  // A ação principal só faz sentido depois de haver o que otimizar.
  var cta = document.getElementById('cta-bar');
  if (cta) cta.style.display = (currentTab === 'opt' && st !== 'vazio') ? '' : 'none';

  if (st === 'vazio') { var b = document.getElementById('acc-h'); if (b) b.setAttribute('aria-expanded', 'false'); }
}

var currentTab = 'opt';

function showTab(name){
  if (TABS.indexOf(name) < 0) name = 'opt';
  TABS.forEach(function(t){
    var pane = document.getElementById('pane-' + t);
    var btn = document.getElementById('tab-' + t);
    var on = t === name;
    if (pane) pane.classList.toggle('on', on);
    if (btn){
      btn.classList.toggle('on', on);
      // aria-selected e o que um leitor de tela usa para dizer onde a pessoa esta; a classe
      // sozinha nao diz nada para ele.
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    }
  });
  // A faixa de ação pertence a UMA aba E a um estado. Quem decide é renderOptState, para a regra
  // viver num lugar só.
  currentTab = name;
  renderOptState();

  // Trocar de aba volta ao topo: a posicao de rolagem da aba anterior nao tem sentido nesta.
  var sc = document.querySelector('.scroll') || document.scrollingElement;
  if (sc) sc.scrollTop = 0;
}

function copiarAuditoria(){
  if (!lastAudit) return;
  var d = lastAudit, c = d.colors || {};
  var lines = [ T('opt.audcopy.title'), T('opt.copy.doc', d.doc || '—'), '',
    T('opt.audcopy.colors', fmt(c.unique), fmt(c.cmyk), fmt(c.rgb), fmt(c.gray), fmt(c.spot)),
    (c.spotNames && c.spotNames.length ? T('opt.audcopy.spot', c.spotNames.join(', ')) : ''),
    (c.findings || []).join('\n'), '',
    T('opt.audcopy.fonts', (d.fonts || []).length, fmt(d.failingFonts)) ];
  (d.fonts || []).forEach(function(f){ lines.push('  - ' + f.name + ': ' + f.summary); });
  var txt = lines.filter(function(l){ return l !== ''; }).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(function(){}, function(){ fallbackCopy(txt); });
  else fallbackCopy(txt);
}

// ── analisar (leitura pura) ────────────────────────────────
function analisar(){
  if (busy) return;
  send({
    cmd:'analisar',
    selection: document.getElementById('op-selection').checked,
    countnodes: document.getElementById('op-countnodes').checked
  });
}

var lastInv = null;

function showInventory(d){
  setTimeout(renderOptState, 0);
  lastInv = d;
  document.getElementById('inv-doc').textContent =
    (d.doc || '—') + (d.ms != null ? '  ·  ' + fmt(d.ms) + ' ms' : '');
  document.getElementById('i-shapes').textContent = fmt(d.shapes);
  // Never show "0" as a fact when counting was skipped — say it was not measured.
  document.getElementById('i-nodes').textContent  =
    (d.nodesCounted === false) ? T('opt.notmeasured') : fmt(d.nodes);
  document.getElementById('i-pc').textContent     = fmt(d.nested);
  document.getElementById('i-raster').textContent = fmt(d.raster);
  document.getElementById('i-red').textContent    = fmt(d.reducible);
  document.getElementById('i-fx').textContent     = fmt(d.effects);
