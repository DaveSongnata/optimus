<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Optimus</title>
<!--
  Optimus docker UI — WebView2, hosted in-process inside CorelDRAW. FULLY OFFLINE: no CDN,
  no webfonts, no external URLs. The compress mark is inline SVG. JS↔C# contract:
    JS→C#: postMessage({cmd:'otimizar', tol, emptylayers, offpage, reopen, selection}) / {cmd:'status'}
    C#→JS: window.optimusReceive({type:'status'|'log'|'busy'|'result', ...})
-->
<style>


/* Segoe UI Variable - a fonte de interface do Windows 11 - tem o digito "1"
   30% mais estreito que os outros. Sem isto, qualquer coluna de numeros TREME
   enquanto os valores mudam durante a analise. Nao custa nada na Segoe classica. */
*{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* Movimento e desligavel: o Windows ja tem esse ajuste e muitas maquinas de
   grafica rodam com ele desligado para o sistema parecer mais rapido. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}

/* Foco visivel: a versao anterior fazia outline:0 e trocava a cor da borda, o
   que some para quem navega por teclado. */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-sm)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);font-family:var(--font-sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none;overflow-y:auto;overflow-x:hidden;
  font-size:var(--f-md);line-height:1.5;
}
.wrap{display:flex;flex-direction:column;height:100%;padding:0}


/* ── header ─────────────────────────────────────────────── */
.head{display:flex;align-items:center;gap:11px;padding:16px 18px 14px;
  background:var(--ink);color:#fff;position:relative;overflow:hidden}
.head::before{content:"";position:absolute;inset:0;opacity:.10;pointer-events:none;
  background:radial-gradient(120px 80px at 88% -10%, var(--brand) 0, transparent 70%)}
.mark{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand));
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(194,65,12,.4);position:relative;z-index:1}
.mark svg{width:19px;height:19px}
.brand{position:relative;z-index:1;line-height:1.1}
.brand .n{font-weight:800;font-size:var(--f-lg);letter-spacing:-.01em}
.brand .s{font-size:var(--f-sm);color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:2px}
.ver{position:relative;z-index:1;font-family:var(--font-mono);font-size:var(--f-sm);color:rgba(255,255,255,.42)}
/* language picker: small and out of the way — it is a settings control, not a feature */
#lang{margin-left:auto;position:relative;z-index:1;background:rgba(255,255,255,.14);color:#fff;
  border:0;border-radius:6px;font-family:var(--font-sans);font-size:var(--f-sm);font-weight:700;
  padding:3px 5px;cursor:pointer;appearance:none}
#lang option{color:var(--ink);background:#fff}

/* The middle is the only thing that scrolls. min-height:0 is required: without it a flex child
   refuses to shrink below its own content and the nav bar gets pushed off screen. ONE rule for
   .body on purpose — there were two, and two rules for the same selector is how one silently
   cancels part of the other. */
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:var(--s4) var(--s4) 0;display:flex;flex-direction:column;gap:14px}

/* ── tick header ────────────────────────────────────────── */
.tick{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.tick .pt{position:relative;width:13px;height:1px;background:var(--brand)}
.tick .pt::before{content:"";position:absolute;left:0;top:-2px;width:1px;height:5px;background:var(--brand)}
.tick .cap{font-weight:700;font-size:var(--f-cap);letter-spacing:.16em;text-transform:uppercase;color:var(--brand);line-height:1}
.tick::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line) 0,transparent 100%)}

/* ── status card ────────────────────────────────────────── */
.status{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-card);padding:var(--s2) var(--s3)}
.st-row{display:flex;align-items:center;gap:9px}
.st-ic{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.st-ic svg{width:15px;height:15px}
.st-tx{min-width:0;flex:1}
.st-doc{font-weight:600;font-size:var(--f-sm);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-meta{font-size:var(--f-cap);color:var(--ink-45);margin-top:1px}
.badge{font-size:var(--f-cap);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--warn-soft);color:var(--warn)}

/* ── level segmented ────────────────────────────────────── */
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:border-color var(--t-fast),background var(--t-fast),transform 90ms}
.seg button .l{font-weight:700;font-size:var(--f-cap);color:var(--ink-70)}
.seg button .d{font-size:var(--f-cap);color:var(--ink-45);font-family:var(--font-mono)}
.seg button:hover{border-color:var(--brand-bright)}
.seg button:active{transform:scale(.97)}
.seg button.on{border-color:var(--brand);background:var(--brand-soft)}
.seg button.on .l{color:var(--brand)}
.seg button.on .d{color:var(--brand)}

/* ── options ────────────────────────────────────────────── */
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:flex-start;gap:var(--s3);padding:10px var(--s2);cursor:pointer;
  border-radius:var(--r-sm);min-height:32px;transition:background var(--t-fast)}
.opt:hover{background:var(--line-2)}
.opt input{margin-top:1px;width:16px;height:16px;flex:0 0 16px;accent-color:var(--brand);cursor:pointer}
.opt .ot{display:block;font-size:var(--f-sm);line-height:1.35;color:var(--ink-70);font-weight:600}
.opt .od{display:block;font-size:var(--f-sm);color:var(--ink-45);margin-top:2px;line-height:1.4;font-weight:400}

/* ── run button ─────────────────────────────────────────── */
.run{background:var(--brand);color:#fff;border:none;border-radius:11px;
  padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:800;font-size:var(--f-sm);letter-spacing:.10em;text-transform:uppercase;
  box-shadow:0 4px 12px -2px rgba(194,65,12,.45);transition:filter var(--t-fast),transform 90ms,box-shadow var(--t-fast);width:100%}
.run svg{width:17px;height:17px}
.run:hover{filter:brightness(1.06);box-shadow:0 6px 16px -2px rgba(194,65,12,.5)}
.run:active{transform:scale(.985)}
.run:disabled{opacity:.55;cursor:default;filter:none;box-shadow:none}
.spinner{width:16px;height:16px;border:2.3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── working banner: the one unmissable "the app is doing something" signal ─ */
.working-banner{display:none;align-items:center;gap:9px;padding:9px 16px;
  background:linear-gradient(90deg,var(--brand),var(--brand));color:#fff;
  font-size:var(--f-cap);font-weight:700;letter-spacing:.01em;
  position:sticky;top:0;z-index:60;box-shadow:0 2px 8px rgba(194,65,12,.25)}
.working-banner.show{display:flex;animation:working-slide-in .22s var(--ease)}
.working-spinner{width:14px;height:14px;flex:0 0 14px;border:2.2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.working-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes working-slide-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── scan (read-only inspection) ─────────────────────────── */
.scan{background:var(--card);color:var(--ink-70);border:1px solid var(--line);border-radius:11px;
  padding:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;font-size:var(--f-cap);letter-spacing:.08em;text-transform:uppercase;width:100%;
  transition:border-color var(--t-fast),color var(--t-fast),transform 90ms}
.scan svg{width:15px;height:15px}
.scan:hover{border-color:var(--brand);color:var(--brand)}
.scan:active{transform:scale(.985)}
.scan:disabled{opacity:.5;cursor:default}
.scan-row{display:flex;gap:6px}
.inv,.aud{display:none;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh-card);overflow:hidden}
.aud.show{display:block;animation:pop .28s var(--ease)}
/* one row per font, with its accent verdict */
.fonts{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.fnt{display:flex;align-items:flex-start;gap:8px;padding:8px 11px;border-bottom:1px solid var(--line-2)}
.fnt:last-child{border-bottom:none}
.fnt .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-top:5px;background:var(--ok)}
.fnt.warn .dot{background:var(--warn)}
.fnt.bad .dot{background:var(--err)}
.fnt.sym .dot{background:var(--ink-30)}
.fnt .fb{flex:1;min-width:0}
.fnt .fn{font-size:var(--f-cap);font-weight:700;color:var(--ink)}
.fnt.bad .fn{color:var(--err)}
.fnt .fs{font-size:var(--f-sm);line-height:1.4;color:var(--ink-45);margin-top:1px}

/* ── colour table + font manager (F9/F10) ─────────────────── */
.mod{border-top:1px solid var(--line-2)}
.mod-h{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--line-2)}
.mod-t{font-size:var(--f-sm);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-70)}
.mod-body{padding:9px 11px;display:flex;flex-direction:column;gap:9px}
.field-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.field-row input[type=text],.field-row textarea,.field-row select{
  font-family:var(--font-sans);font-size:var(--f-cap);color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:7px;padding:6px 8px;flex:1;min-width:80px}
.field-row textarea{width:100%;min-height:52px;resize:vertical;font-family:var(--font-mono)}
.mini-btn{font-family:var(--font-sans);font-size:var(--f-sm);font-weight:700;color:var(--brand);
  background:var(--brand-soft);border:1px solid var(--brand-soft2);border-radius:7px;padding:6px 10px;cursor:pointer;
  white-space:nowrap;transition:background var(--t-fast)}
.mini-btn:hover{background:var(--brand-soft2)}
.mini-btn.ghost{color:var(--ink-45);background:var(--card);border-color:var(--line)}
.mini-btn.danger{color:var(--err);background:#FBEAE0;border-color:#F4D2BE}
.pal-chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:3px 9px 3px 6px;font-size:var(--f-sm);color:var(--ink-70)}
.pal-chip .x{cursor:pointer;color:var(--ink-45);font-weight:800}
.pal-chip .x:hover{color:var(--err)}
.ct-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.ct-row:last-child{border-bottom:none}
.ct-sw{width:18px;height:18px;border-radius:5px;flex:0 0 18px;border:1px solid rgba(0,0,0,.12)}
.ct-b{flex:1;min-width:0}
.ct-n{font-size:var(--f-cap);font-weight:700;color:var(--ink)}
.ct-d{font-size:var(--f-cap);color:var(--ink-45);margin-top:1px}
.ct-usage{font-family:var(--font-mono);font-size:var(--f-cap);font-weight:700;color:var(--ink-70);flex:0 0 auto;width:42px;text-align:right}
.ct-tag{flex:0 0 auto;font-size:var(--f-cap);font-weight:800;padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.ct-tag.in{color:var(--ok);background:var(--ok-soft)}
.ct-tag.out{color:var(--warn);background:var(--warn-soft)}
.ct-actions{display:none;gap:5px;margin-top:6px;padding:8px;background:var(--line-2);border-radius:8px}
.ct-actions.show{display:flex;flex-wrap:wrap}
.ct-row-wrap{border-bottom:1px solid var(--line-2);padding:7px 0}
.ct-row-wrap:last-child{border-bottom:none}
.scope-row{display:flex;gap:12px;font-size:var(--f-sm);color:var(--ink-45)}
.scope-row label{display:flex;align-items:center;gap:4px;cursor:pointer}
.fm-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.fm-row:last-child{border-bottom:none}
.fm-name{flex:1;min-width:0}
.fm-preview{font-size:var(--f-md);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-note{font-size:var(--f-cap);color:var(--ink-45)}

/* F11: comando de voz - botao flutuante + painel. Estado e comunicado por FORMA, nao so cor: */
/* em repouso o botao e so um contorno discreto (nao compete com o CTA principal "Otimizar"); */
/* ele so GANHA peso visual - preenchimento solido, anel pulsante, ondas - no instante em que */
/* passa a fazer algo. Essa e a prova de vida que faltava (Davi, 2026-08-15). */
/* O botao do microfone flutua sobre o canto inferior direito e, com o modal aberto, cobria o
   botao "Do desenho" - um controle de verdade ficando inalcancavel atras de outro. Some enquanto
   houver dialogo na frente: o microfone nao serve para nada la dentro. */
body:has(.modal:not([hidden])) .voice-fab{display:none}

/* Above the bottom bar, never on top of it. At bottom:18px it sat over the third tab and
   covered its label — a floating button that blocks navigation is worse than no button. */
.voice-fab{position:fixed;right:14px;bottom:calc(var(--navbar-h) + var(--s2));width:56px;height:56px;border-radius:50%;
  background:var(--card);color:var(--brand);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:80;
  box-shadow:0 3px 10px rgba(40,20,10,.12);
  transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s,color .2s}
.voice-fab:hover{transform:scale(1.06);border-color:var(--brand-bright);box-shadow:0 5px 16px rgba(194,65,12,.22)}
.voice-fab:active{transform:scale(.96)}
.voice-fab svg{width:22px;height:22px;position:relative;z-index:1}
.voice-fab .voice-bars{display:none;align-items:center;justify-content:center;gap:2.5px;height:20px;position:relative;z-index:1}
.voice-fab .voice-bars i{display:block;width:3px;border-radius:2px;background:#fff;
  animation:voice-bar 1s ease-in-out infinite}
.voice-fab .voice-bars i:nth-child(1){height:7px;animation-delay:-.9s}
.voice-fab .voice-bars i:nth-child(2){height:14px;animation-delay:-.6s}
.voice-fab .voice-bars i:nth-child(3){height:20px;animation-delay:-.3s}
.voice-fab .voice-bars i:nth-child(4){height:11px;animation-delay:-.75s}
.voice-fab .voice-bars i:nth-child(5){height:6px;animation-delay:-.45s}
@keyframes voice-bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.voice-fab.rec{background:linear-gradient(160deg,#E11D48,#9F1239);border-color:transparent;color:#fff;
  animation:voice-pulse 1.6s ease-out infinite}
.voice-fab.rec svg{display:none}
.voice-fab.rec .voice-bars{display:flex}
.voice-fab.busy{background:linear-gradient(160deg,var(--brand),var(--brand));border-color:transparent;color:#fff}
.voice-fab.busy svg{animation:voice-spin .85s linear infinite}
.voice-fab.ok{background:linear-gradient(160deg,var(--ok),#1f5c44);border-color:transparent;color:#fff;animation:voice-pop .4s var(--ease)}
.voice-fab.err{background:linear-gradient(160deg,var(--err),#7c2607);border-color:transparent;color:#fff;animation:voice-shake .4s}
@keyframes voice-pulse{0%{box-shadow:0 0 0 0 rgba(225,29,72,.45),0 4px 14px rgba(159,18,57,.35)}
  70%{box-shadow:0 0 0 14px rgba(225,29,72,0),0 4px 14px rgba(159,18,57,.35)}
  100%{box-shadow:0 0 0 0 rgba(225,29,72,0),0 4px 14px rgba(159,18,57,.35)}}
@keyframes voice-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes voice-pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes voice-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.voice-panel{position:fixed;right:18px;bottom:84px;width:276px;max-width:calc(100vw - 36px);
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px -6px rgba(40,20,10,.22),0 2px 8px rgba(40,20,10,.08);
  padding:0;display:none;flex-direction:column;overflow:hidden;z-index:79}
.voice-panel.show{display:flex;animation:voice-panel-in .22s var(--ease)}
@keyframes voice-panel-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.voice-panel-h{display:flex;align-items:center;gap:7px;padding:11px 12px;
  background:var(--line-2);border-bottom:1px solid var(--line)}
.voice-panel-h .voice-dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--ink-30);transition:background .2s}
.voice-panel-h .voice-dot.rec{background:var(--err);box-shadow:0 0 0 3px rgba(194,65,12,.18);animation:voice-dot-blink 1s ease-in-out infinite}
.voice-panel-h .voice-dot.ok{background:var(--ok)}
@keyframes voice-dot-blink{0%,100%{opacity:1}50%{opacity:.35}}
.voice-panel-h .voice-title{flex:1;font-size:var(--f-sm);font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-70)}
.voice-close{cursor:pointer;color:var(--ink-45);font-weight:700;padding:1px 4px;font-size:var(--f-lg);line-height:1;border-radius:5px;transition:color .15s,background .15s}
.voice-close:hover{color:var(--err);background:rgba(194,65,12,.08)}
.voice-live{padding:12px;display:flex;flex-direction:column;gap:9px}
.voice-status{font-size:var(--f-sm);font-weight:700;color:var(--brand);line-height:1.35;
  transition:opacity .15s}
.voice-transcript{font-size:var(--f-sm);color:var(--ink-70);line-height:1.45;font-style:italic;
  min-height:0;padding:0;border-left:2px solid var(--line);padding-left:9px;
  transition:opacity .2s,max-height .2s;max-height:0;opacity:0;overflow:hidden}
.voice-transcript:not(:empty){max-height:80px;opacity:1;margin:1px 0}
.voice-action{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;
  font-size:var(--f-sm);font-weight:800;color:var(--ok);background:var(--ok-soft);
  padding:4px 9px 4px 8px;border-radius:999px;max-height:0;opacity:0;overflow:hidden;transition:all .2s}
.voice-action:not(:empty){max-height:24px;opacity:1}
.inv.show{display:block;animation:pop .28s var(--ease)}
.inv-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-2)}
.inv-doc{flex:1;min-width:0;font-size:var(--f-cap);font-weight:700;color:var(--ink-70);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-copy{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);padding:4px 9px;cursor:pointer;font-family:var(--font-sans);font-size:var(--f-sm);font-weight:600;color:var(--ink-45);
  transition:border-color var(--t-fast),color var(--t-fast),background var(--t-fast)}
.inv-copy svg{width:12px;height:12px}
.inv-copy:hover{border-color:var(--brand);color:var(--brand)}
.inv-copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.inv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line-2)}
.inv-grid .ic{background:var(--card);padding:9px 10px}
.inv-grid .k{font-size:var(--f-cap);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-45)}
.inv-grid .v{font-family:var(--font-mono);font-size:var(--f-md);font-weight:700;color:var(--ink);margin-top:2px}
.inv-note{padding:8px 11px;font-size:var(--f-sm);line-height:1.45;color:var(--ink-45);border-top:1px solid var(--line-2)}
.obj{border-top:1px solid var(--line-2);padding:10px 11px}
.obj-h{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.obj-t{font-size:var(--f-cap);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);flex:1}
.obj-v{font-family:var(--font-mono);font-size:var(--f-sm);font-weight:700;color:var(--ink)}
.obj-badge{font-size:var(--f-cap);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--warn-soft);color:var(--warn)}
.obj-badge.light{background:var(--ok-soft);color:var(--ok)}
.obj-badge.heavy{background:var(--brand-soft2);color:var(--brand)}
.obj-note{font-size:var(--f-sm);line-height:1.45;color:var(--ink-45)}
/* composition bars: one row per component, width = share of the file */
.bars{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}
.bar{display:flex;align-items:center;gap:7px}
.bar .bk{flex:0 0 74px;font-size:var(--f-cap);color:var(--ink-45)}
.bar .bt{flex:1;height:7px;border-radius:999px;background:var(--line-2);overflow:hidden}
.bar .bf{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand-bright),var(--brand))}
.bar .bv{flex:0 0 40px;text-align:right;font-family:var(--font-mono);font-size:var(--f-cap);color:var(--ink-70)}

/* ── sliders: one control per trade-off, both ends labelled ── */
.sl{margin-bottom:13px}
.sl-h{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
.sl-t{font-weight:700;font-size:var(--f-cap);letter-spacing:.12em;text-transform:uppercase;color:var(--brand);flex:1}
.sl-v{font-size:var(--f-cap);font-weight:700;color:var(--ink)}
.sl-track{display:flex;gap:4px}
.sl-track button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 3px;
  cursor:pointer;font-size:var(--f-sm);font-weight:600;color:var(--ink-45);transition:border-color var(--t-fast),background var(--t-fast),color var(--t-fast)}
.sl-track button:hover:not(:disabled){border-color:var(--brand-bright)}
.sl-track button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.sl-track button:disabled{opacity:.4;cursor:not-allowed}
.sl-ends{display:flex;justify-content:space-between;margin-top:4px;font-size:var(--f-cap);color:var(--ink-45)}
/* ── converter modo de cor ───────────────────────────────────────────────── */
.pf-conv{padding:var(--s3);border-top:1px solid var(--line-2)}
.pf-conv-b{display:flex;gap:var(--s2)}
.pf-conv-x{flex:1;padding:10px var(--s2);border:1px solid var(--border);background:var(--card);
  border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-sans);
  font-size:var(--f-sm);font-weight:700;color:var(--ink-70);min-height:36px;
  transition:border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.pf-conv-x:hover{border-color:var(--brand);color:var(--brand)}
.pf-conv-x:disabled{opacity:.45;cursor:default}
.pf-conv-r{margin-top:var(--s2);font-size:var(--f-sm);color:var(--ok);font-weight:600;
  line-height:var(--lh-body)}
.pf-conv-r.warn{color:var(--warn)}

/* ══ NAVEGAÇÃO ════════════════════════════════════════════════════════════ */
.navbar{flex:0 0 auto;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding:var(--s1) var(--s1) calc(var(--s1) + 2px);box-shadow:0 -1px 12px rgba(40,20,10,.05)}
.nav-i{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:48px;padding:6px 2px;border:0;background:none;cursor:pointer;
  font-family:var(--font-sans);font-size:var(--f-cap);font-weight:700;color:var(--ink-45);
  border-radius:var(--r-sm);transition:color var(--t-fast) var(--ease)}
.nav-i svg{width:22px;height:22px}
.nav-i:hover{color:var(--ink-70)}
/* O destino atual ganha COR e uma barra acima do ícone. Dois sinais, porque só cor não informa. */
.nav-i.on{color:var(--brand)}
.nav-i.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.nav-dot{position:absolute;top:5px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;
  background:var(--err);display:none}
.nav-dot.show{display:block}

/* ══ CARTÃO DE TINTA ══════════════════════════════════════════════════════
   This screen's signature. A print colour becomes a wide BAND with its value set in mono below —
   the ink drawdown card that already sits on the shop's bench. The grid of small squares that was
   here gave ~40px of colour in a 340px column, which is not enough area to judge any colour by,
   and it hid the value in a tooltip nobody reads while scanning. */
.ink-list{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s3);background:var(--bench)}
.ink{display:block;width:100%;text-align:left;padding:0;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--card);cursor:pointer;overflow:hidden;
  transition:box-shadow var(--t-fast) var(--ease)}
.ink:hover{box-shadow:var(--sh-raised)}
.ink.on{box-shadow:0 0 0 2px var(--brand)}
.ink-band{height:44px;width:100%;display:block}
.ink-b{display:flex;align-items:baseline;gap:var(--s2);padding:7px var(--s3) 8px}
.ink-v{flex:1;min-width:0;font-family:var(--font-mono);font-size:var(--f-md);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ink-m{font-size:var(--f-cap);font-weight:700;letter-spacing:.06em;color:var(--ink-45)}
.ink-p{font-family:var(--font-mono);font-size:var(--f-sm);font-weight:700;color:var(--brand)}
/* Off-palette mark: a bar down the side, because a colour outside what was agreed has to stand out
   while scanning the list, not after reading a label. */
.ink.off{border-left:3px solid var(--warn)}

/* ── barra de estado da paleta ───────────────────────────────────────────── */
.pf-palbar{display:flex;align-items:center;gap:var(--s2);padding:var(--s3);
  border-top:1px solid var(--line-2)}
.pf-palbar-t{flex:1;min-width:0;font-size:var(--f-sm);color:var(--ink-45);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-palbar-t.none{color:var(--warn);font-weight:600}

/* ── modal ───────────────────────────────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
/* Ancorado embaixo: o docker e uma coluna alta e estreita, e o polegar/olho estao
   na parte de baixo, junto dos botoes de acao. Centralizar numa coluna de 340px
   so afasta o conteudo de onde a pessoa esta olhando. */
.modal-box{position:relative;width:100%;max-height:86%;display:flex;flex-direction:column;
  background:var(--paper);border-radius:var(--r-md) var(--r-md) 0 0;
  box-shadow:var(--sh-raised);animation:modalUp var(--t-med) var(--ease)}
/* Transform only. Animating opacity on a surface sitting over a dark scrim blends the card
   with the scrim while it rises, and an interruption leaves the card grey for good. */
@keyframes modalUp{from{transform:translateY(12px)}to{transform:none}}
.modal-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--line)}
.modal-t{flex:1;font-size:var(--f-lg);font-weight:800;color:var(--ink)}
.modal-x{width:32px;height:32px;flex:0 0 32px;border:0;background:none;cursor:pointer;
  color:var(--ink-45);font-size:var(--f-md);border-radius:var(--r-sm)}
.modal-x:hover{background:var(--line-2);color:var(--ink)}
.modal-note{padding:var(--s3) var(--s4) 0;font-size:var(--f-sm);color:var(--ink-45);
  line-height:var(--lh-body)}
.modal-b{padding:var(--s3) var(--s4) var(--s5);overflow-y:auto}

.pal-new{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.pal-new input{flex:1;min-width:0;padding:9px var(--s3);border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--field);font-family:var(--font-sans);
  font-size:var(--f-md);color:var(--ink)}

/* Amostras grandes e rotuladas: a amostra É o objeto, o nome vem embaixo. As de 20px sem rótulo
   que estavam aqui obrigavam a passar o mouse e esperar a dica para saber o que era cada uma. */
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
  gap:var(--s2);margin-top:var(--s2)}
.pal-chip{display:flex;flex-direction:column;gap:3px;min-width:0}
.pal-chip-c{height:40px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;
  padding:0;width:100%;transition:transform var(--t-fast) var(--ease)}
.pal-chip-c:hover{transform:scale(1.04)}
.pal-chip-n{font-size:var(--f-cap);color:var(--ink-45);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:center}
.pal-none{margin-top:var(--s2);font-size:var(--f-sm);color:var(--ink-45)}

.pal-acts{display:flex;gap:var(--s2);margin-top:var(--s3)}
.pal-act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;
  padding:7px var(--s2);border:1px solid var(--border);background:var(--card);
  border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-sans);font-size:var(--f-sm);
  font-weight:600;color:var(--ink-70)}
.pal-act:hover{border-color:var(--brand);color:var(--brand)}
.pal-act-sw{width:14px;height:14px;flex:0 0 14px;border-radius:3px;border:1px solid var(--border);
  background:linear-gradient(135deg,#EA580C,#2F5FB3,#186A4B)}

.pal-pane{margin-top:var(--s3);border:1px solid var(--brand);border-radius:var(--r-md);
  background:var(--card);overflow:hidden}
.pal-pane-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);
  border-bottom:1px solid var(--line)}
.pal-pane-t{flex:1;font-size:var(--f-sm);font-weight:700;color:var(--ink)}
.pal-pane-f{display:flex;align-items:center;gap:var(--s2);padding:var(--s3)}
.pal-pane-f input{flex:1;min-width:0;padding:8px var(--s3);border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--field);font-family:var(--font-sans);
  font-size:var(--f-md);color:var(--ink)}
.pal-prev{width:32px;height:32px;flex:0 0 32px;border-radius:var(--r-sm);
  border:1px solid var(--border)}

.pal-doc-i{display:flex;flex-direction:column;gap:3px;min-width:0}
.pal-doc-v{font-size:var(--f-cap);color:var(--ink-45);font-family:var(--font-mono);
  text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pal-doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:var(--s2);padding:var(--s3);max-height:210px;overflow-y:auto}
.pal-doc-c{height:40px;border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;
  padding:0;position:relative}
/* The mark is a SYMBOL, not just a coloured border: in a grid of colours, a highlighted border
   disappears against the swatch's own colour. */
.pal-doc-c.on{box-shadow:0 0 0 2px var(--brand)}
.pal-doc-tick{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:var(--f-lg);font-weight:900;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.85)}

/* O seletor precisa caber na largura do docker. */
#pal-picker-host .picker_wrapper.no_alpha{width:100%}
#pal-picker-host .picker_wrapper{box-shadow:none;border:0;padding:var(--s3);background:transparent}

.pal-card{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);
  padding:var(--s3);margin-bottom:var(--s2)}
/* A padrao ganha borda de marca E um selo escrito. Um destaque so por cor deixaria
   a informacao mais importante desta tela invisivel para parte dos operadores. */
.pal-card.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.pal-card-h{display:flex;align-items:center;gap:var(--s2)}
.pal-card-n{flex:1;min-width:0;font-size:var(--f-md);font-weight:700;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-badge{padding:2px 8px;border-radius:var(--r-pill);background:var(--brand);color:#fff;
  font-size:var(--f-cap);font-weight:800;letter-spacing:.02em}
.pal-set{border:1px solid var(--border);background:var(--card);color:var(--ink-70);
  font-family:var(--font-sans);font-size:var(--f-cap);font-weight:700;cursor:pointer;
  padding:4px 9px;border-radius:var(--r-pill)}
.pal-set:hover{border-color:var(--brand);color:var(--brand)}
.pal-del{width:28px;height:28px;flex:0 0 28px;border:0;background:none;cursor:pointer;
  color:var(--ink-45);border-radius:var(--r-sm);font-weight:800}
.pal-del:hover{background:var(--err-soft);color:var(--err)}
.pal-count{margin-top:var(--s1);font-size:var(--f-sm);color:var(--ink-45)}
.pal-sw{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
.pal-sw i{width:20px;height:20px;border-radius:var(--r-sm);border:1px solid var(--border);
  display:block;cursor:pointer}
.pal-add{display:flex;gap:var(--s1);margin-top:var(--s2)}
.pal-add input{min-width:0;padding:6px var(--s2);border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--field);font-family:var(--font-sans);
  font-size:var(--f-sm);color:var(--ink)}
.pal-add .hx{flex:0 0 92px;font-family:var(--font-mono)}
.pal-add .nm{flex:1}
.pal-from{width:100%;margin-top:var(--s2);padding:7px;border:1px dashed var(--border);
  border-radius:var(--r-sm);background:none;color:var(--ink-70);cursor:pointer;
  font-family:var(--font-sans);font-size:var(--f-sm);font-weight:600}
.pal-from:hover{border-color:var(--brand);color:var(--brand)}
.pal-from:disabled{opacity:.45;cursor:default}

/* Cabecalho do acordeao. E um botao de verdade (nao uma div com onclick) para o
   teclado e o leitor de tela chegarem nele de graca, e carrega aria-expanded
   porque a seta sozinha nao diz nada para quem nao a ve. */
.acc-h{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:40px;
  padding:var(--s2) var(--s3);margin-top:var(--s3);background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;
  font-family:var(--font-sans);text-align:left;transition:border-color var(--t-fast) var(--ease)}
.acc-h:hover{border-color:var(--border)}
.acc-ic{display:flex;width:16px;height:16px;flex:0 0 16px;color:var(--ink-45);
  transition:transform var(--t-med) var(--ease)}
.acc-ic svg{width:100%;height:100%}
.acc-h[aria-expanded="true"] .acc-ic{transform:rotate(180deg)}
.acc-t{font-size:var(--f-md);font-weight:700;color:var(--ink-70)}
/* O resumo e o que impede "recolhido" de virar "escondido": fechado, a linha
   ainda diz o que esta valendo la dentro. */
.acc-s{margin-left:auto;font-size:var(--f-sm);color:var(--ink-45);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:52%}
.acc-h[aria-expanded="true"] .acc-s{display:none}
.acc-b{padding-top:var(--s2)}
.acc-b[hidden]{display:none}

/* A linha que o preset acabou de mudar pisca uma vez. Sem isto o preset altera
   caixas fora do campo de visao e o operador nao fica sabendo - um comando que
   muda coisas invisiveis e pior que nenhum comando. */
@keyframes optFlash{from{background:var(--brand-soft2)}to{background:transparent}}
.opt.flash{animation:optFlash 600ms var(--ease)}

/* "Personalizado": o estado em que a tela ja nao corresponde a preset nenhum.
   Sem ele, seguir destacando "Equilibrado" depois de o operador mexer numa
   caixa e informacao falsa na tela. */
.cap-tag{margin-left:var(--s2);padding:1px 7px;border-radius:var(--r-pill);
  background:var(--brand-soft2);color:var(--brand);font-size:var(--f-cap);
  font-weight:700;letter-spacing:.02em;text-transform:none}

/* A unica opcao que APAGA arte do arquivo. Marcada por barra lateral, nao por
   cor de texto: cor sozinha nao informa (ver O20 e docs/DESIGN.md). */
.opt.danger{border-left:3px solid var(--warn);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding-left:var(--s2)}
.opt.danger .od{color:var(--warn);font-weight:600}

/* Bloco secundario: e escopo do Analisar, nao altera o arquivo. Mais discreto
   para nao competir com as opcoes que mudam o desenho de verdade. */
.tick-q{margin-top:var(--s5);opacity:.75}
.opts-q{opacity:.85}

.sl-c{margin-top:5px;font-size:var(--f-sm);line-height:1.35;color:var(--ink-45)}
.sl-note{font-size:var(--f-sm);line-height:1.4;color:var(--warn);margin-top:5px}
.sl-off{font-size:var(--f-sm);line-height:1.4;color:var(--ink-45);margin-top:5px;font-style:italic}

/* ── live estimate ──────────────────────────────────────── */
.est{background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--sh-card);padding:11px 12px}
.est-head{display:flex;flex-direction:column;gap:2px}
.est-k{font-size:var(--f-cap);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.est-v{font-family:var(--font-mono);font-size:var(--f-hero);line-height:1.05;letter-spacing:-.02em;font-weight:800;color:var(--ink)}
.est-bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden;margin:8px 0}
.est-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand-bright),var(--brand));transition:width .3s ease}
.est-rows{display:flex;flex-direction:column;gap:3px}
.est-row{display:flex;align-items:center;gap:6px;font-size:var(--f-sm)}
.est-row .rk{flex:1;color:var(--ink-45)}
.est-row .rv{font-family:var(--font-mono);color:var(--ink-70)}
.est-row .rl{font-size:var(--f-cap);font-weight:700;text-transform:uppercase;color:var(--warn);letter-spacing:.04em}
.est-row.na .rk{color:var(--ink-45);font-style:italic}
.est-warn{margin-top:8px;font-size:var(--f-sm);line-height:1.45;color:var(--warn)}
.est-warn:empty{display:none}

/* ── result ─────────────────────────────────────────────── */
.result{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-card);overflow:hidden;display:none}
.result.show{display:block;animation:pop .28s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.res-hero{background:linear-gradient(135deg,var(--brand-soft),var(--brand-soft2));padding:15px 16px;text-align:center;border-bottom:1px solid var(--line)}
.res-big{font-weight:800;font-size:var(--f-hero);color:var(--brand);line-height:1;letter-spacing:-.02em}
.res-big span{font-size:var(--f-lg)}
.res-cap{font-size:var(--f-sm);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-top:5px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2)}
.cell{background:var(--card);padding:11px 13px}
.cell .k{font-size:var(--f-cap);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-45)}
.cell .v{font-family:var(--font-mono);font-size:var(--f-md);font-weight:700;color:var(--ink);margin-top:3px}
.cell .v small{font-size:var(--f-sm);color:var(--ink-45);font-weight:400}
/* fluidity block: only rendered when a clock produced the numbers */
.flu{padding:9px 14px;border-top:1px solid var(--line-2);font-size:var(--f-cap)}
.flu:empty{display:none}
.flu-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.flu-k{flex:1;font-size:var(--f-cap);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.flu-v{font-family:var(--font-mono);font-size:var(--f-md);font-weight:800;color:var(--ok)}
.flu-v.worse{color:var(--err)}
.flu-d{color:var(--ink-45);line-height:1.45}
.res-note{padding:9px 14px;font-size:var(--f-cap);color:var(--ink-45);border-top:1px solid var(--line-2);display:flex;align-items:center;gap:7px}
.res-note svg{width:14px;height:14px;flex:0 0 14px;color:var(--ok)}

/* ── log ────────────────────────────────────────────────── */
 .log .ln.err{color:var(--err)} .log .ln.warn{color:var(--warn)} .log .ln.run{color:var(--brand)}

.foot{padding-bottom:var(--s3);margin-top:auto;padding:14px 16px 0;text-align:center;font-size:var(--f-sm);color:var(--ink-45);font-family:var(--font-mono)}

/* ══ TABS ═══════════════════════════════════════════════════ */
/* The panel does two unrelated jobs - shrink the file, and check it prints right. */
/* Stacked in one scroll they buried each other: the colour check sat below the whole */
/* optimizer, so clicking it appeared to do nothing (Davi, 2026-08-15: "fiquei perdido"). */
.tabs{display:flex;gap:2px;padding:3px;background:var(--line-2);border-radius:10px;margin-bottom:2px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;cursor:pointer;
  font-family:var(--font-sans);font-size:var(--f-cap);font-weight:700;color:var(--ink-45);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease)}
.tabs button svg{width:14px;height:14px}
.tabs button:hover{color:var(--ink-70)}
.tabs button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(40,20,10,.10)}
.tabs button .tab-dot{width:6px;height:6px;border-radius:50%;background:var(--err);flex:0 0 6px;display:none}
.tabs button .tab-dot.show{display:block}
.pane{display:none}
.pane.on{display:flex;flex-direction:column;gap:14px;animation:pane-in .22s var(--ease)}
@keyframes pane-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ══ PREFLIGHT (cores + fontes) ═════════════════════════════ */
/* Empty state: one job, one button. */
.pf-empty{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-card);
  padding:22px 18px;text-align:center}
.pf-empty .pf-ic{width:46px;height:46px;margin:0 auto 12px;border-radius:13px;background:var(--brand-soft);
  color:var(--brand);display:flex;align-items:center;justify-content:center}
.pf-empty .pf-ic svg{width:24px;height:24px}
.pf-empty .pf-t{font-size:var(--f-md);font-weight:800;color:var(--ink);margin-bottom:5px}
.pf-empty .pf-d{font-size:var(--f-cap);line-height:1.5;color:var(--ink-45);margin-bottom:16px}

/* Determinate progress. NN/g: past ~10s an indeterminate spinner reads as a hang, so the */
/* bar is real (shape count driven) and the current step is named in words. */
.pf-prog{display:none;background:var(--card);border:1px solid var(--brand-soft2);border-radius:12px;
  box-shadow:var(--sh-card);padding:15px 16px}
.pf-prog.show{display:block;animation:pane-in .2s var(--ease)}
.pf-prog .pf-step{font-size:var(--f-cap);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:5px}
.pf-prog .pf-lab{font-size:var(--f-sm);font-weight:700;color:var(--ink);margin-bottom:11px}
.pf-bar{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden}
.pf-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand-bright),var(--brand));
  width:0%;transition:width .3s var(--ease)}
.pf-pct{margin-top:7px;font-family:var(--font-mono);font-size:var(--f-sm);color:var(--ink-45);text-align:right}

/* Verdict banner: the answer, before any data. */

/* One finding = one consequence, stated in print terms. */
.pf-finds{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--sh-card);overflow:hidden}
.pf-find{display:flex;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line-2);
  transition:background .15s var(--ease)}
.pf-find:last-child{border-bottom:none}
/* MEDIDO: sob deuteranopia (Vienot/Brettel/Mollon 1999) a distancia entre o
   vermelho de ERRO e o ambar de AVISO cai de dE 48,8 para 6,3 - praticamente a
   mesma cor para cerca de 1 em 12 homens. E no papel claro nao da para separar
   quatro matizes por CLARIDADE mantendo 4,5:1 de contraste: todos caem entre
   L* 37 e 41. Um PONTO COLORIDO, que era o que estava aqui, nao carrega
   significado nenhum para essa pessoa - e "isto vai estragar a tiragem" contra
   "confira isto" e justamente a confusao mais cara deste produto.
   Entao quem informa e a FORMA do recipiente mais o simbolo dentro dele; a cor
   virou reforco. As quatro silhuetas se distinguem ate em escala de cinza. */
.pf-find .f-ic{width:16px;height:16px;flex:0 0 16px;margin-top:2px;display:flex;
  align-items:center;justify-content:center;font-size:var(--f-sm);font-weight:800;
  line-height:1;color:#fff;font-family:var(--font-sans)}
.pf-find.err  .f-ic{background:var(--err);border-radius:50%}
.pf-find.ok   .f-ic{background:var(--ok);border-radius:50%}
.pf-find.info .f-ic{background:var(--info);border-radius:3px}
/* O triangulo e a silhueta mais reconhecivel do conjunto e a unica que dispensa
   ler o simbolo interno. O "!" desce 1px porque o centro optico de um triangulo
   nao e o centro geometrico. */
.pf-find.warn .f-ic{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%);
  align-items:flex-end;padding-bottom:1px;font-size:var(--f-cap)}
.pf-find .f-b{flex:1;min-width:0}
.pf-find .f-t{font-size:var(--f-sm);font-weight:700;color:var(--ink);line-height:1.3}
.pf-find.err .f-t{color:var(--err)}
.pf-find .f-d{font-size:var(--f-cap);line-height:1.5;color:var(--ink-45);margin-top:3px}
.pf-find .f-go{margin-top:7px;display:inline-flex;align-items:center;gap:4px;font-size:var(--f-sm);font-weight:700;
  color:var(--brand);background:var(--brand-soft);border:0;border-radius:7px;padding:5px 9px;cursor:pointer;
  font-family:var(--font-sans);transition:background .15s var(--ease)}
.pf-find .f-go:hover{background:var(--brand-soft2)}
.pf-find .f-go svg{width:11px;height:11px}

/* ── colour grid: colours must LOOK like colours ─────────── */
.pf-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-card);overflow:hidden}
.pf-sec-h{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line-2)}
.pf-sec-t{flex:1;font-size:var(--f-sm);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-70)}
.pf-sec-n{font-family:var(--font-mono);font-size:var(--f-cap);font-weight:700;color:var(--brand)}
.pf-sec-b{padding:12px 13px}
.pf-filters{display:flex;gap:5px;flex-wrap:wrap;padding:0 13px 11px}
.pf-chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;cursor:pointer;
  font-family:var(--font-sans);font-size:var(--f-sm);font-weight:700;color:var(--ink-45);
  transition:border-color .15s,color .15s,background .15s}
.pf-chip:hover{border-color:var(--brand-bright);color:var(--ink-70)}
.pf-chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px}
.pf-sw{cursor:pointer;border:0;background:transparent;padding:0;font-family:var(--font-sans);
  display:flex;flex-direction:column;gap:3px;transition:transform .12s var(--ease)}
.pf-sw:hover{transform:translateY(-2px)}
.pf-sw:active{transform:scale(.95)}
.pf-sw .s-c{height:38px;border-radius:8px;border:1px solid var(--border);position:relative;
  box-shadow:inset 0 -8px 12px -8px rgba(0,0,0,.22)}
.pf-sw.on .s-c{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.pf-sw .s-c .s-flag{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;
  background:var(--warn);border:1.5px solid #fff;display:none}
.pf-sw.off .s-c .s-flag{display:block}
.pf-sw .s-p{font-family:var(--font-mono);font-size:var(--f-cap);font-weight:700;color:var(--ink-70);text-align:center}
.pf-sw .s-m{font-size:var(--f-cap);letter-spacing:.06em;color:var(--ink-45);text-align:center;text-transform:uppercase}
.pf-more{width:100%;margin-top:10px;border:1px dashed var(--line);background:transparent;border-radius:9px;
  padding:9px;cursor:pointer;font-family:var(--font-sans);font-size:var(--f-sm);font-weight:700;color:var(--ink-45);
  transition:border-color .15s,color .15s,background .15s}
.pf-more:hover{border-color:var(--brand-bright);color:var(--brand);background:var(--brand-soft)}
.pf-more:disabled{opacity:.5;cursor:default}
.pf-partial{display:flex;align-items:center;gap:7px;margin-bottom:10px;padding:7px 9px;border-radius:8px;
  background:var(--brand-soft);color:var(--brand);font-size:var(--f-sm);font-weight:700}
.pf-partial::before{content:"";width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--brand);
  animation:voice-dot-blink 1s ease-in-out infinite}

/* ── selected-colour detail: replace by PICKING, not typing ─ */
.pf-det{display:none;margin-top:12px;border-top:1px solid var(--line-2);padding-top:12px}
.pf-det.show{display:block;animation:pane-in .2s var(--ease)}
.pf-det-top{display:flex;gap:11px;align-items:center;margin-bottom:12px}
.pf-det-c{width:52px;height:52px;flex:0 0 52px;border-radius:11px;border:1px solid var(--border);
  box-shadow:inset 0 -10px 14px -10px rgba(0,0,0,.25)}
.pf-det-i{min-width:0;flex:1}
.pf-det-v{font-family:var(--font-mono);font-size:var(--f-md);font-weight:800;color:var(--ink)}
.pf-det-u{font-size:var(--f-sm);color:var(--ink-45);margin-top:3px}
.pf-det-tag{display:inline-block;margin-top:5px;font-size:var(--f-cap);font-weight:800;padding:3px 7px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.04em}
.pf-det-tag.in{background:var(--ok-soft);color:var(--ok)}
.pf-det-tag.out{background:var(--warn-soft);color:var(--warn)}
.pf-lab{font-size:var(--f-cap);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-45);margin-bottom:6px}
.pf-picks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pf-pick{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);cursor:pointer;padding:0;
  transition:transform .12s var(--ease),box-shadow .12s}
.pf-pick:hover{transform:scale(1.12)}
.pf-pick.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.pf-manual{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.pf-manual input{flex:1;min-width:0;font-family:var(--font-mono);font-size:var(--f-cap);color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.pf-manual input:focus{outline:0;border-color:var(--brand-bright)}
.pf-modes{display:flex;gap:3px;background:var(--line-2);border-radius:8px;padding:2px}
.pf-modes button{border:0;background:transparent;border-radius:6px;padding:5px 8px;cursor:pointer;
  font-family:var(--font-sans);font-size:var(--f-cap);font-weight:800;color:var(--ink-45);transition:background .15s,color .15s}
.pf-modes button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 2px rgba(40,20,10,.1)}
.pf-scope{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.pf-scope label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;
  font-size:var(--f-cap);color:var(--ink-70);transition:background .15s}
.pf-scope label:hover{background:var(--line-2)}
.pf-scope input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.pf-go{width:100%;background:var(--brand);color:#fff;border:0;
  border-radius:10px;padding:12px;cursor:pointer;font-family:var(--font-sans);font-weight:800;font-size:var(--f-cap);
  letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 12px -3px rgba(194,65,12,.45);
  transition:filter .15s,transform 90ms,opacity .15s}
.pf-go:hover{filter:brightness(1.07)}
.pf-go:active{transform:scale(.98)}
.pf-go:disabled{opacity:.45;cursor:default;filter:none;box-shadow:none}

/* ── fonts: the name rendered IN its own font is the check ── */
.pf-font{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line-2)}
.pf-font:last-child{border-bottom:none}
.pf-font .fo-ic{width:15px;height:15px;flex:0 0 15px;display:flex;align-items:center;
  justify-content:center;font-size:var(--f-cap);font-weight:800;line-height:1;color:#fff;
  font-family:var(--font-sans)}
.pf-font.err  .fo-ic{background:var(--err);border-radius:50%}
.pf-font.ok   .fo-ic{background:var(--ok);border-radius:50%}
.pf-font.sym  .fo-ic{background:var(--ink-45);border-radius:3px}
.pf-font.warn .fo-ic{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%);
  align-items:flex-end;padding-bottom:1px;font-size:var(--f-cap)}
.pf-font .fo-b{flex:1;min-width:0}
/* O especimen. Grande o bastante para o acento ser visivel: a 11px o til e o
   cedilha somem e a amostra deixaria de provar o que se propos a provar.
   O fallback e serif de proposito - se a face nao carregar, a diferenca com a
   interface (sans) e obvia, em vez de parecer que a fonte carregou. */
.pf-font .fo-sp{margin-top:6px;font-size:var(--f-lg);line-height:1.35;color:var(--ink);
  font-family:serif;opacity:0;max-height:0;overflow:hidden;
  transition:opacity var(--t-med) var(--ease)}
.pf-font .fo-sp.on{opacity:1;max-height:60px}
.pf-font .fo-sp.fail{opacity:1;max-height:40px;font-family:var(--font-sans);
  font-size:var(--f-sm);color:var(--ink-45);font-style:italic}
.pf-font .fo-n{font-size:var(--f-md);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.pf-font .fo-s{font-size:var(--f-sm);color:var(--ink-45);margin-top:2px;line-height:1.4}
.pf-font.err .fo-s{color:var(--err)}
.pf-note{padding:10px 13px;font-size:var(--f-sm);line-height:1.5;color:var(--ink-45);border-top:1px solid var(--line-2)}
.pf-cap{display:flex;gap:6px;padding:11px 13px;border-top:1px solid var(--line-2);background:var(--paper)}
.pf-cap input{flex:1;min-width:0;font-family:var(--font-sans);font-size:var(--f-cap);color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.pf-cap input:focus{outline:0;border-color:var(--brand-bright)}
/* Estado da medicao de uso. Discreto de proposito: e informacao sobre o proprio
   programa, nao sobre o desenho do cliente, entao nao pode competir com as cores. */
.pf-meas{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);
  color:var(--ink-45);font-size:var(--f-sm)}
.pf-meas-t{flex:1;min-width:0}
.pf-meas-x{background:none;border:0;color:var(--brand);font-family:var(--font-sans);
  font-size:var(--f-sm);font-weight:700;cursor:pointer;padding:var(--s1) var(--s2);
  border-radius:var(--r-sm)}
.pf-meas-x:hover{background:var(--brand-soft)}

.pf-pal{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 11px}
.pf-folder-path{flex:1;min-width:0;font-family:var(--font-mono);font-size:var(--f-sm);color:var(--ink-45);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.pf-pal-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:3px 4px 3px 9px;font-size:var(--f-sm);color:var(--ink-70)}
.pf-pal-chip .p-sw{display:flex;gap:2px}
.pf-pal-chip .p-sw i{width:9px;height:9px;border-radius:3px;border:1px solid rgba(0,0,0,.12);display:block}
.pf-pal-chip .x{cursor:pointer;color:var(--ink-45);font-weight:800;padding:0 4px;border-radius:5px}
.pf-pal-chip .x:hover{color:var(--err);background:rgba(194,65,12,.08)}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <span class="mark">
      <!-- compress / optimize mark: four arrows converging to the centre -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        <path d="M9 9l-4-4M15 9l4-4M9 15l-4 4M15 15l4 4"/>
      </svg>
    </span>
    <div class="brand">
      <div class="n">Optimus</div>
      <div class="s" data-i18n="opt.tagline"></div>
    </div>
      <div class="head-mic" id="voice-fab" onclick="voiceFabClick()" data-i18n-title="opt.voice.title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
      <path d="M19 11a7 7 0 0 1-14 0"/>
      <path d="M12 18v3"/>
      </svg>
      <span class="voice-bars"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    <select id="lang" data-i18n-title="opt.lang">
      <option value="pt">PT</option>
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
  </div>

  <!-- Working banner: the ONE place every busy state shows, regardless of what triggered it
       (button click or voice) or where on screen the operator is looking. A voice command that
       starts a multi-minute job used to give feedback only on the small run-button icon, easy to
       miss entirely if the operator's eyes were on the voice panel instead (Davi, 2026-08-15). -->
  <div class="working-banner" id="working-banner">
    <span class="working-spinner"></span>
    <span class="working-text" id="working-text">—</span>
  </div>

  <div class="body">

    <!-- status -->
    <div class="status">
      <div class="st-row">
        <span class="st-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M18 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2z"/></svg></span>
        <div class="st-tx">
          <div class="st-doc" id="st-doc">—</div>
          <div class="st-meta" id="st-meta" data-i18n="opt.waiting"></div>
        </div>
        <span class="badge no" id="st-badge">—</span>
      </div>
    </div>


    <!-- ══ TAB 1 — otimizar (tamanho e fluidez) ══════════════════ -->
    <div class="pane on" id="pane-opt">

    <!-- Welcome state. Names the next step instead of describing the product: the operator did not
         open a docker to read about it. -->
    <div class="welcome" id="opt-welcome">
      <span class="welcome-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M8.5 12.5l2.5 2.5 6-6.5"/></svg>
      </span>
      <div class="welcome-t" data-i18n="opt.welcome.title"></div>
      <div class="welcome-d" data-i18n="opt.welcome.body"></div>
    </div>

    <!-- presets -->
    <div id="opt-modes">
      <div class="tick"><span class="pt"></span><span class="cap" data-i18n="opt.section.how"></span><span class="cap-tag" id="preset-custom" style="display:none" data-i18n="opt.preset.custom"></span></div>
      <div class="seg choice" id="presets">
        <button data-preset="Safe"><span class="l" data-i18n="opt.preset.safe"></span><span class="d" data-i18n="opt.preset.safe.hint"></span></button>
        <button data-preset="Balanced" class="on"><span class="l" data-i18n="opt.preset.balanced"></span><span class="d" data-i18n="opt.preset.balanced.hint"></span></button>
        <button data-preset="MaxSavings"><span class="l" data-i18n="opt.preset.max"></span><span class="d" data-i18n="opt.preset.max.hint"></span></button>
      </div>
    </div>

    <!-- ══ AJUSTES FINOS ═══════════════════════════════════════════════════════
         Os quatro controles e as tres opcoes estavam TODOS abertos ao mesmo tempo,
         abaixo dos presets. Sao sete decisoes empilhadas numa coluna de 340px, e
         o operador que so queria "Equilibrado" tinha que rolar por todas elas para
         chegar no botao. Pior: a presenca delas sugere que precisam ser mexidas,
         quando o preset ja respondeu a pergunta.
         Agora ficam recolhidas. Quem quer ajustar abre - e o resumo na aba diz o
         que esta valendo la dentro, para fechado nao virar escondido. -->
    <!-- live estimate for the current positions, BEFORE applying -->
    <!-- Empty state: compact, and it names the next step instead of describing the feature. -->
    <div class="empty" id="est-empty">
      <span class="empty-t" data-i18n="opt.est.title"></span>
      <span class="empty-d" data-i18n="opt.est.empty"></span>
    </div>

    <div class="est" id="est" style="display:none">
      <!-- Two lines. Squeezed onto one, the label and the numbers fought for a 340px row and the
           figure — the only reason this card exists — came out the smaller of the two. -->
      <div class="est-head">
        <span class="est-k" data-i18n="opt.est.title"></span>
        <span class="est-v" id="est-v">—</span>
      </div>
      <div class="est-bar"><div class="est-fill" id="est-fill" style="width:0%"></div></div>
      <div class="est-rows" id="est-rows"></div>
      <div class="est-warn" id="est-warn"></div>
    </div>

    <button class="acc-h" id="acc-h" onclick="toggleAdvanced()" aria-expanded="false"
            aria-controls="acc-body">
      <span class="acc-ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </span>
      <span class="acc-t" data-i18n="opt.adv.title"></span>
      <span class="acc-s" id="acc-sum"></span>
    </button>

    <div class="acc-b" id="acc-body" hidden>

    <!-- the four sliders, in the operator's language (no ICC, no DPI) -->
    <div id="sliders"></div>

    <!-- options -->
    <div>
      <div class="tick"><span class="pt"></span><span class="cap" data-i18n="opt.section.changes"></span></div>
      <div class="opts">
        <label class="opt">
          <input type="checkbox" id="op-instance" onchange="markCustom();scheduleEstimate()">
          <span><span class="ot" data-i18n="opt.opt.instance.t"></span><span class="od" data-i18n="opt.opt.instance.d"></span></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="op-flatten" onchange="markCustom();scheduleEstimate()">
          <span><span class="ot" data-i18n="opt.opt.flatten.t"></span><span class="od" data-i18n="opt.opt.flatten.d"></span></span>
        </label>
        <label class="opt danger">
          <input type="checkbox" id="op-offpage" onchange="markCustom();scheduleEstimate()">
          <span><span class="ot" data-i18n="opt.opt.offpage.t"></span><span class="od" data-i18n="opt.opt.offpage.d"></span></span>
        </label>
      </div>
    </div>

    </div><!-- /acc-b -->



    <!-- Only "Analisar" here now: the colour/font check moved to its own tab, where it is the
         primary action instead of a second button competing for the same glance. -->
    <details class="disclose group">
      <summary data-i18n="opt.section.scan"></summary>
      <div class="opts opts-q">
      <label class="opt">
        <input type="checkbox" id="op-selection">
        <span><span class="ot" data-i18n="opt.opt.selection.t"></span></span>
      </label>
      <label class="opt">
        <input type="checkbox" id="op-countnodes" checked>
        <span><span class="ot" data-i18n="opt.opt.countnodes.t"></span><span class="od" data-i18n="opt.opt.countnodes.d"></span></span>
      </label>
      </div>
    </details>

    <div class="scan-row">
      <button class="scan" id="scan" onclick="analisar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span data-i18n="opt.btn.analyze"></span>
      </button>
    </div>

    <!-- inventory: what is REALLY inside the file, PowerClips included -->
    <div class="inv" id="inv">
      <div class="inv-head">
        <span class="inv-doc" id="inv-doc">—</span>
        <button class="inv-copy" id="inv-copy" onclick="copiarInventario()" data-i18n-title="opt.btn.copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span id="inv-copy-tx" data-i18n="opt.btn.copy"></span>
        </button>
      </div>
      <details class="disclose group inv-drop">
      <summary data-i18n="opt.inv.details"></summary>
      <div class="inv-grid">
        <div class="ic"><div class="k" data-i18n="opt.inv.shapes"></div><div class="v" id="i-shapes">—</div></div>
        <div class="ic"><div class="k" data-i18n="opt.inv.nodes"></div><div class="v" id="i-nodes">—</div></div>
        <div class="ic"><div class="k" data-i18n="opt.inv.nested"></div><div class="v" id="i-pc">—</div></div>
        <div class="ic"><div class="k" data-i18n="opt.inv.raster"></div><div class="v" id="i-raster">—</div></div>
        <div class="ic"><div class="k" data-i18n="opt.inv.reducible"></div><div class="v" id="i-red">—</div></div>
        <div class="ic"><div class="k" data-i18n="opt.inv.fx"></div><div class="v" id="i-fx">—</div></div>
      </div>
      <div class="inv-note" id="inv-note"></div>

      <!-- The two objectives are reported SEPARATELY, because they have separate levers (O8):
           size lives in raster/preview/ICC; fluidity lives in nodes/objects/live effects. -->
      <div class="obj" id="obj-size">
        <div class="obj-h"><span class="obj-t" data-i18n="opt.size.title"></span><span class="obj-v" id="sz-total">—</span></div>
        <div class="bars" id="sz-bars"></div>
        <div class="obj-note" id="sz-note"></div>
      </div>

      <div class="obj" id="obj-flu">
        <div class="obj-h"><span class="obj-t" data-i18n="opt.flu.title"></span><span class="obj-badge" id="fl-band">—</span></div>
        <div class="obj-note" id="fl-note"></div>
      </div>
    </div>


    <!-- result -->
      </details>
    <div class="result" id="result">
      <div class="res-hero">
        <div class="res-big" id="res-big">0<span>%</span></div>
        <div class="res-cap" data-i18n="opt.res.reduction"></div>
      </div>
      <!-- Label left, value right, one row each: these numbers exist to be compared, and a grid
           with the label ON TOP of the value breaks the column they would be compared in. -->
      <div class="kv">
        <div class="kv-r"><span class="kv-k" data-i18n="opt.res.size"></span><span class="kv-v" id="c-size">—</span></div>
        <div class="kv-r"><span class="kv-k" data-i18n="opt.res.nodes"></span><span class="kv-v" id="c-nodes">—</span></div>
        <div class="kv-r"><span class="kv-k" data-i18n="opt.res.curves"></span><span class="kv-v" id="c-curves">—</span></div>
        <div class="kv-r"><span class="kv-k" data-i18n="opt.res.clean"></span><span class="kv-v" id="c-clean">—</span></div>
      </div>
      <!-- Fluidity is only shown when a CLOCK measured it. No timing, no claim. -->
      <div class="flu" id="res-flu"></div>
      <div class="res-note" id="res-note"></div>
    </div>

    </div><!-- /pane-opt -->

    <!-- ══ TAB 2 — cores e fontes (conferencia de pre-impressao) ══════════════
         Ordem deliberada: VEREDITO primeiro, dados depois. Um operador decide
         "posso imprimir?" - ele nao estuda uma tabela de estatistica de cor. -->
    <div class="pane" id="pane-cores">

      <!-- estado vazio: um trabalho, um botao -->
      <div class="pf-empty" id="pf-empty">
        <div class="pf-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l2 2 4-4"/><path d="M20.5 12a8.5 8.5 0 1 1-3.2-6.6"/>
          </svg>
        </div>
        <div class="pf-t" data-i18n="opt.pf.empty.title"></div>
        <div class="pf-d" data-i18n="opt.pf.empty.body"></div>
        <button class="pf-go" onclick="auditar()" data-i18n="opt.pf.run"></button>
      </div>

      <!-- progresso DETERMINADO: a barra e movida pela contagem real de formas -->
      <div class="pf-prog" id="pf-prog">
        <div class="pf-step" id="pf-step">—</div>
        <div class="pf-lab" id="pf-lab">—</div>
        <div class="pf-bar"><div class="pf-fill" id="pf-fill"></div></div>
        <div class="pf-pct" id="pf-pct">0%</div>
      </div>

      <!-- resultado -->
      <div id="pf-result" style="display:none">

        <div class="pf-finds mb-4" id="pf-finds"></div>

        <!-- cores: precisam PARECER cores, nao uma tabela de texto -->
        <div class="pf-sec mb-4" id="pf-colors">
          <div class="pf-sec-h">
            <span class="pf-sec-t" data-i18n="opt.pf.colors.title"></span>
            <span class="pf-sec-n" id="pf-colors-n">—</span>
          </div>
          <div class="pf-filters" id="pf-filters"></div>
          <div class="pf-sec-b">
            <div class="pf-partial" id="pf-partial" style="display:none" data-i18n="opt.pf.colors.partial"></div>
            <div class="pf-grid" id="pf-grid"></div>
            <div class="pf-note" id="pf-grid-empty" style="display:none;padding:14px 0 4px;border:0"
                 data-i18n="opt.pf.colors.none"></div>
            <!-- A cauda de cores irrelevantes fica recolhida, nunca descartada. -->
            <button class="pf-more" id="pf-minor" style="display:none" onclick="pfToggleMinor()"></button>
            <!-- A medicao de uso comeca SOZINHA (ver pfAutoMeasure). Isto aqui deixou de ser um
                 botao: virou o estado dela, porque o operador nao tem por que saber que existem
                 duas passadas por dentro. -->
            <div class="pf-meas" id="pf-meas" style="display:none">
              <span class="pf-meas-t" id="pf-meas-t"></span>
              <button class="pf-meas-x" id="pf-meas-x" onclick="pfStopMeasure()"
                      data-i18n="opt.pf.colors.measure.stop"></button>
            </div>

            <!-- detalhe da cor selecionada: trocar ESCOLHENDO, nao digitando -->
            <div class="pf-det" id="pf-det">
              <div class="pf-det-top">
                <span class="pf-det-c" id="pf-det-c"></span>
                <div class="pf-det-i">
                  <div class="pf-det-v" id="pf-det-v">—</div>
                  <div class="pf-det-u" id="pf-det-u">—</div>
                  <span class="pf-det-tag" id="pf-det-tag"></span>
                </div>
              </div>

              <div id="pf-picks-wrap" style="display:none">
                <div class="pf-lab" data-i18n="opt.pf.replace.pick"></div>
                <div class="pf-picks" id="pf-picks"></div>
              </div>

              <div class="pf-lab" data-i18n="opt.pf.replace.manual"></div>
              <div class="pf-manual">
                <input type="text" id="pf-target" data-i18n-placeholder="opt.pf.replace.hexph" oninput="pfManualTyped()">
                <div class="pf-modes">
                  <button id="pf-mode-rgb" class="on" onclick="pfSetMode('Rgb')">RGB</button>
                  <button id="pf-mode-cmyk" onclick="pfSetMode('Cmyk')">CMYK</button>
                </div>
              </div>

              <div class="pf-lab" data-i18n="opt.pf.replace.scope"></div>
              <div class="pf-scope">
                <label><input type="radio" name="pf-scope" value="all" checked><span data-i18n="opt.pal.allcolors"></span></label>
                <label><input type="radio" name="pf-scope" value="sel"><span data-i18n="opt.pal.selonly"></span></label>
              </div>

              <button class="pf-go" id="pf-replace" onclick="pfReplace()" data-i18n="opt.pf.replace.go"></button>
              <div class="pf-conv-r" id="pf-repl-r" style="display:none"></div>
            </div>
          </div>

          <!-- ══ PALETA ═══════════════════════════════════════════════════════
               O que existia aqui era um campo de nome e um botao "Criar paleta"
               que congelava as cores do arquivo aberto num registro. Isso inverte
               o que uma paleta e: nao existe "arquivo de paleta" - existe a arte
               do cliente, que por acaso contem cores dentro e fora do combinado.
               A paleta e do CLIENTE e precisa poder ser montada antes mesmo de
               existir arquivo. Sem paleta padrao, "fora da paleta" nao mede nada,
               e era por isso que a tela nao servia para nada.
               Aqui fica so o ESTADO - contra o que estamos conferindo - e a porta
               para o lugar onde paletas se administram. -->
          <!-- ══ CONVERTER ════════════════════════════════════════════════════
               A auditoria ja sabia dizer "RGB e CMYK misturados" e nao oferecia
               NADA para resolver. Um diagnostico sem acao obriga o operador a
               sair da tela, selecionar tudo na mao e converter pelo menu do
               Corel - que e exatamente o trabalho que este produto existe para
               tirar dele. -->
          <div class="bulk" id="pf-conv">
            <div class="bulk-t">
              <span class="status-ic status-warn" aria-hidden="true">!</span>
              <span data-i18n="opt.pf.bulk.title"></span>
            </div>
            <div class="bulk-b" id="pf-conv-buttons">
              <button class="btn-quiet" onclick="pfAskConvert('Rgb')" data-i18n="opt.pf.convert.rgb"></button>
              <button class="btn-quiet" onclick="pfAskConvert('Cmyk')" data-i18n="opt.pf.convert.cmyk"></button>
            </div>

            <!-- The question replaces the buttons rather than sitting beside them: two live routes
                 to the same destructive action is how an accidental click happens. -->
            <div class="bulk-confirm" id="pf-conv-ask" style="display:none">
              <div class="bulk-q" id="pf-conv-q"></div>
              <div class="bulk-b">
                <button class="btn-quiet" onclick="pfCancelConvert()" data-i18n="opt.pf.bulk.cancel"></button>
                <button class="btn-primary" onclick="pfDoConvert()" data-i18n="opt.pf.bulk.go"></button>
              </div>
            </div>
            <details class="disclose"><summary data-i18n="opt.why"></summary>
              <div data-i18n="opt.pf.convert.note"></div>
            </details>
            <div class="pf-conv-r" id="pf-conv-r" style="display:none"></div>
          </div>

          <div class="pf-palbar">
            <span class="pf-palbar-t" id="pf-palbar-t"></span>
            <button class="mini-btn" onclick="palOpen()" data-i18n="opt.pal.manage"></button>
          </div>
        </div>

    </div><!-- fecha o que a extracao das fontes levou junto -->
    </div><!-- /pane-cores -->

    <!-- ══ TAB 3 — fonts ════════════════════════════════════════════════════
         Split from colours on request: they are two different jobs. A colour is fixed by changing
         ink; a font is fixed by installing a file. Stacked in one tab, the second lived below the
         fold and was never seen. -->
    <div class="pane" id="pane-fontes">
      <!-- Font findings live here, next to what resolves them. -->
      <div class="pf-finds mb-4" id="fo-finds" style="display:none"></div>
        <!-- fontes: o nome desenhado NA propria fonte e a verificacao -->
        <div class="pf-sec" id="pf-fonts-sec">
          <div class="pf-sec-h">
            <span class="pf-sec-t" data-i18n="opt.pf.fonts.title"></span>
            <span class="pf-sec-n" id="pf-fonts-n">—</span>
          </div>
          <!-- A canned pangram answers a question nobody asked. What the operator needs to see is
               the CLIENT'S name in the client's font, and that is what this field is for. It is
               deliberately transient: the question of the moment, not a setting. -->
          <div class="pf-lab" data-i18n="opt.pf.font.text"></div>
          <div class="pal-new">
            <input type="text" id="fo-text" data-i18n-placeholder="opt.pf.font.textph"
                   oninput="foTextTyped()">
          </div>

          <div id="pf-fonts"></div>
          <!-- Modelo do Corel Font Manager: aponte uma PASTA, nao cole uma lista de nomes.
               O nome sozinho nao diz onde a fonte esta nem se ela escreve portugues. -->
          <!-- Title + action first; the explanation goes behind a disclosure. A paragraph is the
               answer to "how does this work", and that is not the question someone has while
               looking at a screen that says nothing is configured yet. -->
          <div class="pf-note" id="pf-folder-note" data-i18n="opt.pf.fonts.nofolder.short"></div>
          <details class="disclose">
            <summary data-i18n="opt.how"></summary>
            <div data-i18n="opt.pf.fonts.nofolder"></div>
          </details>
          <div id="pf-folder-list"></div>
          <div class="pf-cap">
            <span class="pf-folder-path" id="pf-folder-path"></span>
            <button class="mini-btn" id="pf-folder-btn" onclick="pfPickFolder()" data-i18n="opt.pf.fonts.pick"></button>
          </div>
        </div>
        <button class="scan mt-4" onclick="auditar()" data-i18n="opt.pf.rerun"></button>
    </div><!-- /pane-fontes -->

  </div>


<!-- ══ NAVEGAÇÃO ════════════════════════════════════════════════════════════
     Bottom bar, three destinations. The column is phone-width, and on a phone navigation lives
     where the thumb reaches. At the top it competes for space with the file's identity, which is
     the one thing that has to stay visible at all times. -->

<!-- ══ AÇÃO PRINCIPAL ══════════════════════════════════════════════════════
     Its own strip, between the content and the navigation. It used to sit inside the scroll,
     touching the tab bar: an ACTION that rewrites the client's file sharing one visual space
     with NAVIGATION that only changes subject. It also scrolled away, and the screen's main
     action must not depend on where the operator happens to have scrolled to.
     Shown only on the tab where it means something — an "optimise the file" button while
     reading the font list is not an action, it is noise. -->
<div class="cta-bar" id="cta-bar">
  <button class="run" id="run" onclick="otimizar()">
  <span id="run-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 12.5a1 1 0 0 0 .8 1.6H11l-1 7.9 8.5-10.5a1 1 0 0 0-.8-1.6H12l1-7.9z"/></svg></span>
  <span id="run-tx" data-i18n="opt.btn.run"></span>
  </button>
</div>

<nav class="navbar" id="navbar" role="tablist">
  <button class="nav-i on" id="tab-opt" role="tab" aria-selected="true" onclick="showTab('opt')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h8l-1 8 10-12h-8z"/></svg>
    <span data-i18n="opt.tab.optimize"></span>
  </button>
  <button class="nav-i" id="tab-cores" role="tab" aria-selected="false" onclick="showTab('cores')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.8-.8 1.8-1.8 0-1.3-.9-1.6-.9-2.4 0-.7.6-1.2 1.2-1.2H16a5 5 0 0 0 5-5c0-4.1-4-7.6-9-7.6z"/><circle cx="7.5" cy="11" r="1.3" fill="currentColor" stroke="none"/><circle cx="11" cy="7" r="1.3" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="opt.tab.colors"></span>
    <span class="nav-dot" id="tab-pf-dot"></span>
  </button>
  <button class="nav-i" id="tab-fontes" role="tab" aria-selected="false" onclick="showTab('fontes')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20l6-15h2l6 15M8 14h8"/></svg>
    <span data-i18n="opt.tab.fonts"></span>
    <span class="nav-dot" id="tab-fo-dot"></span>
  </button>
</nav>
  <div class="foot" data-i18n="opt.foot"></div>
